      () => toast('Standort nicht verfügbar'),
      { enableHighAccuracy:true, timeout:12000, maximumAge:60000 }
    );
  };

  const merkePersonen = () => {
    const neu = pool.slice();
    prot.anwesende.forEach(a => {
      if (a.name.trim() && !neu.some(x => x.name === a.name)) neu.push({ name:a.name, funktion:a.funktion, firma:a.firma, kontakt:a.kontakt });
    });
    setPool(neu.slice(-120));
  };

  const wordSpeichern = async (protokoll=prot) => {
    merkePersonen();
    const { blob, name } = await exportDocx(akt, protokoll);
    if (cloud?.connected) {
      await cloud.saveProtocol(akt, blob, name);
      toast('In OneDrive gespeichert: ' + name);
    } else {
      saveBlob(blob, name);
      toast('Microsoft nicht verbunden – Word heruntergeladen: ' + name);
    }
    return name;
  };

  const word = async () => {
    setBusy(true);
    try {
      await wordSpeichern(prot);
    } catch (e) {
      console.error(e);
      toast('Word-Ablage fehlgeschlagen: ' + (e.message || String(e)));
    } finally {
      setBusy(false);
    }
  };

  const aufnahmeAbschliessen = async () => {
    if (busy) return;
    setBusy(true);
    try {
      const finalProt = Object.assign({}, prot, {
        status:'abgeschlossen',
        geaendert:new Date().toISOString()
      });
      setProt(finalProt);
      await wordSpeichern(finalProt);
      toast('Aufnahme abgeschlossen und Word abgelegt');
    } catch (e) {
      console.error(e);
      toast('Aufnahme konnte nicht abgeschlossen werden: ' + (e.message || String(e)));
    } finally {
      setBusy(false);
    }
  };

  const summe = useMemo(() => {
    let f = 0, w = 0;
    wohnungen.flatMap(x=>x.raeume||[]).forEach(r => { if (!r.bez.trim() || !r.betroffen) return; const v = raumWerte(r); f += n(r.betroffenBoden)>0?n(r.betroffenBoden):v.flaeche; w += n(r.betroffenWand)>0?n(r.betroffenWand):v.wand; });
    return { f, w };
  }, [prot.wohnungen, prot.raeume]);

  return (
    <div>
      <p className="eyebrow">{akt.aktenzeichen || 'ohne AZ'} · {akt.bezeichnung}</p>
      <h2 className="sec">Ortsaugenschein</h2>
      <p className="mono" style={{ fontSize:12, color:'var(--muted)' }}>{aktOrdner(akt)}/02_Unterlagen SV/</p>

      <div className="steps">
        {SCHRITTE.map((t, i) => (
          <button key={t} className={'step' + (i === schritt ? ' on' : i < schritt ? ' done' : '')}
            onClick={() => setSchritt(i)}>
            <span className="n">{String(i + 1).padStart(2, '0')}</span>
            <span className="t">{t}</span>
          </button>
        ))}
      </div>

      {/* ---------- SCHRITT 1 ---------- */}
      {schritt === 0 && (
        <div>
          <Card titel="Termin">
            <div className="grid g4">
              <Txt l="Datum" type="date" v={prot.datum} set={v => s('datum', v)} />
              <Txt l="Uhrzeit" type="time" v={prot.uhrzeit} set={v => s('uhrzeit', v)} />
              <Sel l="Witterung" v={prot.witterung} set={v => s('witterung', v)} opts={WITTERUNG} />
              <Txt l="Temperatur °C" v={prot.temperatur} set={v => s('temperatur', v)} num />
            </div>
            <div className="grid g2" style={{ marginTop:12 }}>
              <Txt l="Sachverständiger" v={prot.gutachter} set={v => s('gutachter', v)} />
              <div>
                <span className="eyebrow" style={{ display:'block', marginBottom:3 }}>Koordinaten</span>
                <div style={{ display:'flex', gap:8 }}>
                  <div className="calc" style={{ flex:1, textAlign:'left' }}>
                    {prot.gps ? prot.gps.lat.toFixed(5) + ', ' + prot.gps.lon.toFixed(5) + '  ±' + Math.round(prot.gps.acc) + ' m' : 'nicht erfasst'}
                  </div>
                  <button className="btn sm" onClick={gps}>Standort</button>
                </div>
              </div>
            </div>
          </Card>

          <Card titel="Anwesende Personen"
            extra={<button className="btn sig sm" onClick={() => s('anwesende', prot.anwesende.concat({ id:uid(), name:'', funktion:'', firma:'', kontakt:'' }))}>+ Person</button>}>
            <datalist id="dl-namen">{pool.map((p, i) => <option key={i} value={p.name} />)}</datalist>
            <datalist id="dl-funktionen">{FUNKTIONEN.map(f => <option key={f} value={f} />)}</datalist>
            <div className="rows">
              {prot.anwesende.map((a, i) => (
                <div key={a.id} className="row person">
                  <Fld l="Name">
                    <input list="dl-namen" value={a.name}
                      onChange={e => {
                        const v = e.target.value; const t = pool.find(x => x.name === v);
                        const arr = prot.anwesende.slice();
                        arr[i] = Object.assign({}, arr[i], t ? { name:v, funktion:t.funktion || arr[i].funktion, firma:t.firma || arr[i].firma, kontakt:t.kontakt || arr[i].kontakt } : { name:v });
                        s('anwesende', arr);
                      }} />
                  </Fld>
                  <Fld l="Funktion"><input list="dl-funktionen" value={a.funktion} onChange={e => liste('anwesende', i, 'funktion', e.target.value)} /></Fld>
                  <Txt l="Firma / Vertretung" v={a.firma} set={v => liste('anwesende', i, 'firma', v)} />
                  <Txt l="Kontakt" v={a.kontakt} set={v => liste('anwesende', i, 'kontakt', v)} />
                  <Kill on={() => s('anwesende', prot.anwesende.filter((_, j) => j !== i))} />
                </div>
              ))}
            </div>
          </Card>
        </div>
      )}

      {/* ---------- SCHRITT 2 ---------- */}
      {schritt === 1 && (
        <div>
          <Card titel="Objekt">
            <div className="grid g4">
              <Sel l="Objektart" v={prot.objektart} set={v => s('objektart', v)} opts={OBJEKTARTEN} />
              <Sel l="Baujahr" v={prot.baujahr} set={v => s('baujahr', v)} opts={BAUJAHRE} leer="— Baujahr wählen —" />
              <Combo l="Nutzung" v={prot.nutzung} set={v => s('nutzung', v)} opts={NUTZUNGEN} />
              <Combo l="Geschoss / Lage" v={prot.geschoss} set={v => s('geschoss', v)} opts={GESCHOSSE} />
            </div>
            <div style={{marginTop:12}}><Sel l="Allgemeiner Erhaltungs- / Instandhaltungszustand" v={prot.allgemeinzustand||''} set={v => s('allgemeinzustand', v)} opts={ERHALTUNGSZUSTAENDE} leer="— Zustand wählen —" /></div>
          </Card>

          <Card titel="Befund">
            <Area l="Schadensbild — Feststellungen vor Ort" v={prot.schadensbild} set={v => s('schadensbild', v)} hoch
              ph="Was ist sichtbar? Wertfrei beschreiben: Lage, Ausmaß, Erscheinungsbild, betroffene Bauteile." />
            <div style={{ marginTop:12 }}>
              <Area l="Schadenshergang laut Auskunft vor Ort" v={prot.hergang} set={v => s('hergang', v)}
                ph="Angaben der anwesenden Personen — als Auskunft kennzeichnen, nicht als eigene Feststellung." />
            </div>
            <div className="grid g2" style={{ marginTop:12 }}>
              <Txt l="Schadenszeitpunkt laut Angabe" v={prot.schadenszeitpunkt} set={v => s('schadenszeitpunkt', v)} ph="ca. KW 12/2026" />
              <Txt l="Vorschäden / Vorbefassung" v={prot.vorschaeden} set={v => s('vorschaeden', v)} />
            </div>
          </Card>

          <Card titel="Wohnungen · Räume und Flächen">
            <div className="rows">
              {wohnungen.map((wohnung, wi) => (
                <div key={wohnung.id} className="card" style={{margin:'0 0 14px',padding:14}}>
                  <div className="card-h">Wohnung {wi+1}</div>
                  <div className="grid g2" style={{marginBottom:8}}>
                    <Txt l="Bewohner / Mieter" v={wohnung.bewohner||''} set={v=>setWohnung(wi,'bewohner',v)} ph="Name Bewohner / Mieter" />
                    <Sel l="Etage" v={wohnung.etage||'EG'} set={v=>setWohnung(wi,'etage',v)} opts={ETAGEN} />
                  </div>
                  <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',marginBottom:12}}>
                    <span className="eyebrow">Schadenzuordnung</span>
                    <button type="button" className={`btn sm ${wohnung.schadenZuordnung==='Ursachenbereich'?'sig':''}`} onClick={()=>setWohnung(wi,'schadenZuordnung','Ursachenbereich')}>{wohnung.schadenZuordnung==='Ursachenbereich'?'✓ ':''}Ursachenbereich</button>
                    <button type="button" className={`btn sm ${(wohnung.schadenZuordnung||'Folgeschaden')==='Folgeschaden'?'sig':''}`} onClick={()=>setWohnung(wi,'schadenZuordnung','Folgeschaden')}>{(wohnung.schadenZuordnung||'Folgeschaden')==='Folgeschaden'?'✓ ':''}Folgeschaden</button>
                  </div>
                  <div className="rows">
                    {(wohnung.raeume||[]).map((r, ri) => {
                      const v=raumWerte(r);
                      return <div key={r.id} style={{borderTop:'1px solid var(--rule)',paddingTop:10,marginTop:6}}>
                        <div className="row raum">
                          <Combo l="Raum" v={r.bez} set={x=>setWohnungsRaum(wi,ri,'bez',x)} opts={RAEUME_OPTS} ph="Raum wählen oder frei eingeben" />
                          <Txt l="Länge m" v={r.laenge} set={x=>setWohnungsRaum(wi,ri,'laenge',x)} num />
                          <Txt l="Breite m" v={r.breite} set={x=>setWohnungsRaum(wi,ri,'breite',x)} num />
                          <Sel l="Höhe m" v={r.hoehe} set={x=>setWohnungsRaum(wi,ri,'hoehe',x)} opts={RAUMHOEHEN} leer="—" />
                          <div><span className="eyebrow" style={{display:'block',marginBottom:3}}>Fläche</span><div className="calc">{de(v.flaeche)} m²</div></div>
                          <Kill on={()=>delRaumWohnung(wi,ri)} />
                        </div>
                        <div className="grid g3" style={{marginTop:8}}>
                          <Combo l="Bodenbelag" v={r.belag||''} set={x=>setWohnungsRaum(wi,ri,'belag',x)} opts={BODENBELAEGE} ph="Bodenbelag wählen oder frei eingeben" />
                          <Txt l="Betroffener Bodenbelag m²" v={r.betroffenBodenbelag||''} set={x=>setWohnungsRaum(wi,ri,'betroffenBodenbelag',x)} num ph={`max. Raumfläche: ${de(v.flaeche)} m²`} />
                          <Combo l="Wandbelag / Wandoberfläche" v={r.wandoberflaeche||''} set={x=>setWohnungsRaum(wi,ri,'wandoberflaeche',x)} opts={WANDBELAEGE} ph="Wandbelag wählen oder frei eingeben" />
                          <Txt l="Betroffener Bodenaufbau m²" v={r.betroffenBoden||''} set={x=>setWohnungsRaum(wi,ri,'betroffenBoden',x)} num ph={`berechnet: ${de(v.flaeche)} m²`} />
                          <Txt l="Betroffene Wandfläche m²" v={r.betroffenWand||''} set={x=>setWohnungsRaum(wi,ri,'betroffenWand',x)} num ph={`berechnet: ${de(v.wand)} m²`} />
                          <Txt l="Betroffene Deckenfläche m²" v={r.betroffenDecke||''} set={x=>setWohnungsRaum(wi,ri,'betroffenDecke',x)} num ph={`berechnet: ${de(v.flaeche)} m²`} />
                          <Txt l="Betroffene Sockelleisten lfm" v={r.sockel||''} set={x=>setWohnungsRaum(wi,ri,'sockel',x)} num ph={`Umfang: ${de(v.umfang)} lfm`} />
                        </div>
                        <div className="grid g3" style={{marginTop:8}}>
                          <label className="check"><input type="checkbox" checked={!!r.deckeBetroffen} onChange={e=>setWohnungsRaum(wi,ri,'deckeBetroffen',e.target.checked)} /><span>{r.deckeBetroffen?'✓ Decke betroffen':'Decke betroffen'}</span></label>
                          <label className="check"><input type="checkbox" checked={!!r.sockelBetroffen} onChange={e=>setWohnungsRaum(wi,ri,'sockelBetroffen',e.target.checked)} /><span>{r.sockelBetroffen?'✓ Sockelleisten betroffen':'Sockelleisten betroffen'}</span></label>
                          <Txt l="Anmerkung / Feststellung" v={r.bemerkung||''} set={x=>setWohnungsRaum(wi,ri,'bemerkung',x)} />
                        </div>
                        <div style={{marginTop:10}}>
                          <span className="eyebrow" style={{display:'block',marginBottom:6}}>Vorgesehene Wiederherstellung · automatisch aus betroffenen Flächen</span>
                          <div className="calc" style={{whiteSpace:'normal',lineHeight:1.5}}>{[
                            n(r.betroffenBodenbelag)>0?`${de(r.betroffenBodenbelag)} m² Bodenbelag${r.belag?' · '+r.belag:''}`:'',
                            n(r.betroffenBoden)>0?`${de(r.betroffenBoden)} m² Bodenaufbau`:'',
                            n(r.betroffenWand)>0?`${de(r.betroffenWand)} m² Wand${r.wandoberflaeche?' · '+r.wandoberflaeche:''}`:'',
                            r.deckeBetroffen?`${de(n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche)} m² Decke`:'',
                            r.sockelBetroffen?`${de(n(r.sockel)>0?n(r.sockel):v.umfang)} lfm Sockelleisten`:'',
                            r.trockenbauRueckbau&&r.trockenbauRueckbau!=='Nicht erforderlich'?r.trockenbauRueckbau:'',
                            r.verbundabdichtung==='Ja – vorhanden / wiederherzustellen'?'Verbundabdichtung wiederherstellen':
                            r.verbundabdichtung==='Nein – nicht vorhanden'?'keine Verbundabdichtung vorhanden':
                            r.verbundabdichtung==='Vorhandensein nicht feststellbar'?'Verbundabdichtung nicht feststellbar':'',
                            r.tuerschaden&&r.tuerschaden!=='Keine sichtbaren Schäden'?`Tür: ${r.tuerschaden==='Sonstige sichtbare Schäden'&&r.tuerschadenFreitext?r.tuerschadenFreitext:r.tuerschaden}`:'',
                            r.elektropruefung==='Empfohlen'?'Elektroüberprüfung empfohlen':'',
                            r.individuelleBeschreibungAktiv&&r.individuelleBeschreibung?r.individuelleBeschreibung:''
                          ].filter(Boolean).join(' · ') || 'Noch keine betroffenen Flächen bzw. konstruktiven Maßnahmen erfasst.'}</div>
                        </div>
                        <div className="grid g2" style={{marginTop:8}}>
                          <Sel l="Trockenbau · erforderlicher Rückbau" v={r.trockenbauRueckbau||'Nicht erforderlich'} set={x=>setWohnungsRaum(wi,ri,'trockenbauRueckbau',x)} opts={TROCKENBAU_RUECKBAU} />
                          <Sel l="Verbundabdichtung unter Fliesen" v={r.verbundabdichtung||'Nicht relevant'} set={x=>setWohnungsRaum(wi,ri,'verbundabdichtung',x)} opts={VERBUNDABDICHTUNG} />
                          <div>
                            <Sel l="Tür · sichtbare Schäden" v={TUERSCHAEDEN.includes(r.tuerschaden)?r.tuerschaden:(r.tuerschaden?'Sonstige sichtbare Schäden':'Keine sichtbaren Schäden')} set={x=>setWohnungsRaum(wi,ri,'tuerschaden',x)} opts={TUERSCHAEDEN} leer="— Türschaden wählen —" />
                            {r.tuerschaden==='Sonstige sichtbare Schäden' && (
                              <div style={{marginTop:6}}><Txt l="Tür · individuelle Schadensbeschreibung" v={r.tuerschadenFreitext||''} set={x=>setWohnungsRaum(wi,ri,'tuerschadenFreitext',x)} ph="z. B. Ablösung der Deckschicht" /></div>
                            )}
                          </div>
                          <Sel l="Elektroüberprüfung" v={r.elektropruefung||'Nicht erforderlich'} set={x=>setWohnungsRaum(wi,ri,'elektropruefung',x)} opts={ELEKTROPRUEFUNG} />
                          <Combo l="Zusätzliche Wiederherstellungsmaßnahme" v={r.zusatzmassnahme||''} set={x=>setWohnungsRaum(wi,ri,'zusatzmassnahme',x)} opts={ZUSATZMASSNAHMEN} ph="Maßnahme wählen oder frei eingeben" />
                          <Txt l="Ergänzung / individuelle Maßnahme" v={r.massnahmen||''} set={x=>setWohnungsRaum(wi,ri,'massnahmen',x)} ph="nur falls zusätzlich erforderlich" />
                        </div>
                        <div style={{marginTop:8}}>
                          {!r.individuelleBeschreibungAktiv ? (
                            <button className="btn secondary" type="button" onClick={()=>setWohnungsRaum(wi,ri,'individuelleBeschreibungAktiv',true)}>+ Individuelle Beschreibung</button>
                          ) : (
                            <div>
                              <Txt l="Individuelle Beschreibung" v={r.individuelleBeschreibung||''} set={x=>setWohnungsRaum(wi,ri,'individuelleBeschreibung',x)} ph="Zusätzliche individuelle Feststellung oder Beschreibung" />
                              <button className="btn ghost" type="button" style={{marginTop:6}} onClick={()=>{
                                setWohnungsRaum(wi,ri,'individuelleBeschreibung','');
                                setWohnungsRaum(wi,ri,'individuelleBeschreibungAktiv',false);
                              }}>Feld entfernen</button>
                            </div>
                          )}
                        </div>
                        <div className="row" style={{gridTemplateColumns:'1fr auto',marginTop:8,borderTop:0}}>
                          <div></div>
                          <label className="check" style={{alignSelf:'end',whiteSpace:'nowrap',fontWeight:r.betroffen?700:400}}>
                            <input type="checkbox" checked={!!r.betroffen} onChange={e=>setWohnungsRaum(wi,ri,'betroffen',e.target.checked)} />
                            <span>{r.betroffen ? '✓ betroffen' : 'betroffen'}</span>
                          </label>
                        </div>
                      </div>;
                    })}
                  </div>
                  {(()=>{ const rs=(wohnung.raeume||[]).filter(r=>r.bez&&r.betroffen); let bf=0,wf=0,df=0,sl=0; rs.forEach(r=>{const rv=raumWerte(r); bf+=n(r.betroffenBodenbelag)>0?n(r.betroffenBodenbelag):(n(r.betroffenBoden)>0?n(r.betroffenBoden):rv.flaeche); wf+=n(r.betroffenWand)>0?n(r.betroffenWand):rv.wand; if(r.deckeBetroffen)df+=n(r.betroffenDecke)>0?n(r.betroffenDecke):rv.flaeche; if(r.sockelBetroffen)sl+=n(r.sockel)>0?n(r.sockel):rv.umfang;}); return <div style={{marginTop:12}}><div className="sum"><span className="k">Wohnung {wi+1} · Boden / Wand</span><span className="v">{de(bf)} m² / {de(wf)} m²</span></div><div className="sum" style={{borderTopWidth:1,borderTopColor:'var(--rule)'}}><span className="k">Decke / Sockelleisten</span><span className="v">{de(df)} m² / {de(sl)} lfm</span></div></div>;})()}
                  <div style={{marginTop:10}}><button className="btn sig sm" onClick={()=>addRaumWohnung(wi)}>+ Raum hinzufügen</button></div>
                </div>
              ))}
            </div>
            <div style={{margin:'12px 0'}}><button className="btn sig" onClick={()=>setWohnungen(wohnungen.concat(leereWohnung()))}>+ Weitere Wohnung hinzufügen</button></div>
            <div className="sum"><span className="k">Summe Bodenfläche betroffen</span><span className="v">{de(summe.f)} m²</span></div>
            <div className="sum" style={{borderTopWidth:1,borderTopColor:'var(--rule)'}}><span className="k">Summe Wandfläche betroffen</span><span className="v">{de(summe.w)} m²</span></div>
          </Card>
        </div>
      )}

      {/* ---------- SCHRITT 3 ---------- */}
      {schritt === 2 && (
        <div>
          <Card titel="Technische Trocknung">
            <label className="check">
              <input type="checkbox" checked={prot.trocknung.erforderlich} onChange={e => st('erforderlich', e.target.checked)} />
              Technische Trocknung erforderlich
            </label>
            {prot.trocknung.erforderlich && (
              <div className="grid g3" style={{ marginTop:12 }}>
                <Txt l="Beginn" type="date" v={prot.trocknung.beginn} set={v => st('beginn', v)} />
                <Txt l="Voraussichtliche Dauer" v={prot.trocknung.dauer} set={v => st('dauer', v)} ph="14 Tage" />
                <Txt l="Stromzähler / Verrechnung" v={prot.trocknung.strom} set={v => st('strom', v)} ph="Zwischenzähler gesetzt" />
              </div>
            )}
          </Card>

          {prot.trocknung.erforderlich && (
            <div>
              <Card titel="Eingesetzte Geräte"
                extra={<button className="btn sig sm" onClick={() => st('geraete', prot.trocknung.geraete.concat({ id:uid(), typ:'', anzahl:'1' }))}>+ Gerät</button>}>
                {!prot.trocknung.geraete.length && <p style={{ color:'var(--muted)', margin:0 }}>Noch keine Geräte erfasst.</p>}
                <div className="rows">
                  {prot.trocknung.geraete.map((g, i) => (
                    <div key={g.id} className="row geraet">
                      <Sel l="Gerätetyp" v={g.typ} set={v => tListe('geraete', i, 'typ', v)} opts={GERAETE} />
                      <Txt l="Anzahl" v={g.anzahl} set={v => tListe('geraete', i, 'anzahl', v)} num />
                      <Kill on={() => st('geraete', prot.trocknung.geraete.filter((_, j) => j !== i))} />
                    </div>
                  ))}
                </div>
              </Card>

              <Card titel="Feuchtemessungen"
                extra={<button className="btn sig sm" onClick={() => st('messungen', prot.trocknung.messungen.concat({ id:uid(), ort:'', material:'', wert:'', datum:heute() }))}>+ Messung</button>}>
                {!prot.trocknung.messungen.length && <p style={{ color:'var(--muted)', margin:0 }}>Noch keine Messwerte erfasst.</p>}
                <div className="rows">
                  {prot.trocknung.messungen.map((m, i) => (
                    <div key={m.id} className="row mess">
                      <Txt l="Messort" v={m.ort} set={v => tListe('messungen', i, 'ort', v)} ph="Bad, Wand Süd" />
                      <Sel l="Material" v={m.material} set={v => tListe('messungen', i, 'material', v)} opts={MATERIALIEN} />
                      <Txt l="Messwert" v={m.wert} set={v => tListe('messungen', i, 'wert', v)} ph="87 Digits" />
                      <Txt l="Datum" type="date" v={m.datum} set={v => tListe('messungen', i, 'datum', v)} />
                      <Kill on={() => st('messungen', prot.trocknung.messungen.filter((_, j) => j !== i))} />
                    </div>
                  ))}
                </div>
              </Card>
            </div>
          )}
        </div>
      )}

      {/* ---------- SCHRITT 4 ---------- */}
      {schritt === 3 && (
        <div>
          <Card titel="Skizze">
            <Txt l="Bildunterschrift" v={prot.skizzeTitel} set={v => s('skizzeTitel', v)} ph="Grundriss OG, betroffene Flächen schraffiert — ohne Maßstab" />
            <div style={{ marginTop:12 }}><Skizze key={prot.id} v={prot.skizze} set={v => s('skizze', v)} /></div>
          </Card>


          <Card titel="Beurteilung und Abschluss">
            <Area l="Vorläufige Ursachenzuordnung" v={prot.ursache} set={v => s('ursache', v)}
              ph="Erste fachliche Einordnung — als vorläufig kennzeichnen." />
            <div style={{ marginTop:12 }}>
              <Area l="Zusammenfassung" v={prot.zusammenfassung} set={v => s('zusammenfassung', v)} hoch />
            </div>
            <div className="grid g2" style={{ marginTop:12 }}>
              <Area l="Empfehlung" v={prot.empfehlung} set={v => s('empfehlung', v)} />
              <Area l="Nächster Schritt" v={prot.naechsterSchritt} set={v => s('naechsterSchritt', v)} ph="Estrichöffnung durch Trocknungsfirma, Nachbefundung KW 20" />
            </div>
            <div style={{marginTop:12,display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
              <button className="btn sig" type="button" disabled={busy} onClick={aufnahmeAbschliessen}>
                {busy ? 'Wird abgeschlossen …' : '✓ Aufnahme abschließen & Word ablegen'}
              </button>
              <span className={'chip '+(prot.status==='abgeschlossen'?'fertig':'entwurf')}>
                {prot.status==='abgeschlossen'?'Aufnahme abgeschlossen':'Aufnahme offen'}
              </span>
            </div>
          </Card>

          <Card titel="Ausgabe">
            <p style={{ marginTop:0, color:'var(--muted)', fontSize:14 }}>
              {cloud?.connected
                ? 'Das Worddokument wird direkt in OneDrive gespeichert. „Aufnahme abschließen & Word ablegen“ erledigt Status und Word-Ausgabe gemeinsam.'
                : 'Microsoft ist nicht verbunden. Das Worddokument wird lokal heruntergeladen.'}
            </p>
            <p className="mono" style={{ fontSize:13 }}>{aktOrdner(akt)}/02_Unterlagen SV/</p>
            <button className="btn sig" disabled={busy} onClick={word}>
              {busy ? 'Wird erstellt …' : 'Als Word ablegen'}
            </button>
          </Card>
        </div>
      )}

      <div className="bar">
        <span className="note">gespeichert · {dDE(prot.datum)}</span>
        <button className="btn ghost" onClick={() => go({ mode:'akt', aktId:akt.id })}>Zum Akt</button>
        <button className="btn ghost" disabled={schritt === 0} onClick={() => setSchritt(schritt - 1)}>Zurück</button>
        {schritt < 3
          ? <button className="btn" onClick={() => setSchritt(schritt + 1)}>Weiter</button>
          : <button className="btn sig" disabled={busy} onClick={word}>Word</button>}
      </div>
    </div>
  );
}

/* ============================================================
   11  ANWENDUNG
   ============================================================ */
function App() {
  const [akten, setAkten] = useState(() => load(STORE, []));
  const [pool, setPool]   = useState(() => load(POOL, []));
  const [view, setView]   = useState({ mode:'start' });
  const [sheet, setSheet] = useState(false);
  const [msg, setMsg]     = useState(null);
  const [railAuf, setRailAuf] = useState(false);
  const [msCfg, setMsCfgState] = useState(() => Object.assign({},DEFAULT_MS,load(MSSTORE,DEFAULT_MS)));
  const [msToken, setMsToken] = useState(() => load(MSTOKEN,null));
  const [msUser, setMsUser] = useState(null);
  const [agentCfg, setAgentCfgState] = useState(() => Object.assign({},DEFAULT_AGENT,load(AGENTSTORE,DEFAULT_AGENT)));
  const setAgentCfg = v => { setAgentCfgState(v); save(AGENTSTORE,v); };

  const setMsCfg = v => { setMsCfgState(v); save(MSSTORE,v); };
  useEffect(() => { if (!save(STORE, akten)) setMsg('Speicher voll — bitte Datensicherung anlegen'); }, [akten]);
  useEffect(() => { save(POOL, pool); }, [pool]);

  const toast = t => { setMsg(t); clearTimeout(window.__t); window.__t = setTimeout(() => setMsg(null), 2600); };
  const go = v => { setView(v); setRailAuf(false); window.scrollTo(0, 0); };


  useEffect(()=>{
    (async()=>{
      const q=new URLSearchParams(location.search), code=q.get('code'), state=q.get('state'), err=q.get('error');
      if(err){toast(q.get('error_description')||err);history.replaceState({},'',msRedirectUri());return;}
      if(code){
        if(state!==sessionStorage.getItem('gp_oauth_state')){toast('Microsoft-Anmeldung: Sicherheitsprüfung fehlgeschlagen');return;}
        try{const t=await exchangeMicrosoftCode(msCfg,code);setMsToken(t);history.replaceState({},'',msRedirectUri());toast('Microsoft verbunden');}
        catch(e){toast(e.message||String(e));}
      }
    })();
  },[]);

  const accessToken=async()=>{
    let t=msToken || load(MSTOKEN,null); if(!t)return null;
    if((t.expires_at||0)<Date.now()+60000){t=await refreshMicrosoftToken(msCfg,t); if(t)setMsToken(t);}
    return t?.access_token||null;
  };
  const graph=async(path,opts={})=>{
    const tok=await accessToken(); if(!tok)throw new Error('Nicht mit Microsoft verbunden');
    const r=await fetch('https://graph.microsoft.com/v1.0'+path,Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:'Bearer '+tok})}));
    if(r.status===204)return null; const d=await r.json().catch(()=>null); if(!r.ok)throw new Error(d?.error?.message||('Microsoft Graph '+r.status)); return d;
  };
  useEffect(()=>{if(msToken?.access_token)graph('/me?$select=displayName,userPrincipalName').then(setMsUser).catch(()=>setMsUser(null));else setMsUser(null);},[msToken]);
  const cloudRoot = () => (msCfg.root||'Gutachten_Business').replace(/^\/+|\/+$/g,'');
  const cloudStatusPath = key => key==='offen' ? cloudRoot() : `${cloudRoot()}/${STATUS_ORDNER[key]}`;
  const cloudAktPath = a => statusKey(a)==='abgelegt' ? `${cloudStatusPath('abgelegt')}/${a.ablageKategorie||a.schadensart||'Leitungswasser'}/${aktName(a)}` : `${cloudStatusPath(statusKey(a))}/${aktName(a)}`;
  const graphItemByPath=async path=>graph(`/me/drive/root:/${encPath(path)}:`);
  const ensurePath=async path=>{
    const parts=String(path).split('/').filter(Boolean); let parent='root', built=[];
    for(const name of parts){
      built.push(name); let item=null;
      try{item=await graphItemByPath(built.join('/'));}catch(e){}
      if(!item){item=await graph(parent==='root'?'/me/drive/root/children':`/me/drive/items/${parent}/children`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});}
      parent=item.id;
    }
    return parent;
  };
  const ensureBase=async()=>{await ensurePath(cloudRoot());for(const k of ['tagesbesichtigung','besichtigt','abgelegt'])await ensurePath(cloudStatusPath(k));};
  const childByName=async(parentId,name)=>{
    const d=await graph(`/me/drive/items/${parentId}/children?$select=id,name,folder,file,size,lastModifiedDateTime,webUrl&$orderby=name`);
    return (d.value||[]).find(x=>x.name===name)||null;
  };
  const ensureChildFolder=async(parentId,name)=>{
    let item=await childByName(parentId,name);
    if(item) return item;
    return graph(`/me/drive/items/${parentId}/children`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,folder:{},'@microsoft.graph.conflictBehavior':'fail'})});
  };
  const resolveAktItem=async a=>{
    if(a.cloudItemId){try{return await graph(`/me/drive/items/${a.cloudItemId}?$select=id,name,parentReference,webUrl`);}catch(e){}}
    return graphItemByPath(cloudAktPath(a));
  };
  const ensureAkt=async a=>{try{
    await ensureBase();
    let item;
    try{ item=await resolveAktItem(a); }
    catch(e){ const id=await ensurePath(cloudAktPath(a)); item=await graph(`/me/drive/items/${id}?$select=id,name,parentReference,webUrl`); }
    for(const o of ORDNER) await ensureChildFolder(item.id,o.key);
    toast('OneDrive-Aktenstruktur geprüft');
    return {cloudItemId:item.id};
  }catch(e){toast(e.message||String(e));return false;}};
  const moveAkt=async(a,targetKey)=>{
    await ensureBase(); const item=await resolveAktItem(a); const parentId=await ensurePath(cloudStatusPath(targetKey));
    const moved=await graph(`/me/drive/items/${item.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({parentReference:{id:parentId}})});
    return {cloudItemId:moved.id,cloudParentStatus:targetKey};
  };
  const archiveCategories=async()=>{
    await ensureBase(); const d=await graph(`/me/drive/root:/${encPath(cloudStatusPath('abgelegt'))}:/children?$select=id,name,folder&$orderby=name`);
    return (d.value||[]).filter(x=>x.folder).map(x=>x.name);
  };
  const archiveAkt=async(a,category)=>{
    await ensureBase(); const item=await resolveAktItem(a); const parentId=await ensurePath(cloudStatusPath('abgelegt')+'/'+category);
    const moved=await graph(`/me/drive/items/${item.id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({parentReference:{id:parentId}})});
    return {cloudItemId:moved.id,cloudParentStatus:'abgelegt',ablageKategorie:category};
  };
  const resolveSubfolder=async(a,o,create=false)=>{
    const aktItem=await resolveAktItem(a);
    let sub=await childByName(aktItem.id,o);
    if(!sub && create) sub=await ensureChildFolder(aktItem.id,o);
    if(!sub) throw new Error(`Ordner ${o} im Akt nicht gefunden`);
    return sub;
  };
  const listCloud=async(a,o)=>{
    const sub=await resolveSubfolder(a,o,false);
    const d=await graph(`/me/drive/items/${sub.id}/children?$select=id,name,size,folder,file,lastModifiedDateTime,webUrl&$orderby=name`);
    return d.value||[];
  };
  const uploadCloud=async(a,o,file)=>{
    const sub=await resolveSubfolder(a,o,true);
    return graph(`/me/drive/items/${sub.id}:/${encodeURIComponent(file.name)}:/content`,{method:'PUT',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});
  };
  const saveProtocolCloud=async(a,blob,name)=>{
    const sub=await resolveSubfolder(a,'02_Unterlagen SV',true);
    return graph(`/me/drive/items/${sub.id}:/${encodeURIComponent(name)}:/content`,{method:'PUT',headers:{'Content-Type':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'},body:blob});
  };
  const listAktRoot=async(a)=>{
    const item=await resolveAktItem(a);
    const d=await graph(`/me/drive/items/${item.id}/children?$select=id,name,size,folder,file,lastModifiedDateTime,webUrl,parentReference&$orderby=name`);
    return d.value||[];
  };
  const listChildren=async(parentId)=>{
    const d=await graph(`/me/drive/items/${parentId}/children?$select=id,name,size,folder,file,lastModifiedDateTime,webUrl,parentReference&$orderby=name`);
    return d.value||[];
  };
  const uploadToParent=async(parentId,file)=> graph(`/me/drive/items/${parentId}:/${encodeURIComponent(file.name)}:/content`,{method:'PUT',headers:{'Content-Type':file.type||'application/octet-stream'},body:file});
  const parseCloudAktName = name => {
    const p=String(name||'').split('_').filter(Boolean);
    const versIdx=p.findIndex(x=>VERSICHERUNGEN.includes(x));
    let schadennummer='', versicherung='', rest=[];
    if(versIdx>0){
      schadennummer=p.slice(0,versIdx).join('_');
      versicherung=p[versIdx];
      rest=p.slice(versIdx+1);
    } else {
      schadennummer=p.shift()||name;
      versicherung=(p[0] && VERSICHERUNGEN.includes(p[0])) ? p.shift() : '';
      rest=p;
    }
    let schadensart='';
    if(rest.length && SCHADENARTEN.includes(rest[rest.length-1])) schadensart=rest.pop();
    const ort=rest.shift()||'';
    const bezeichnung=rest.join(' ').replace(/_/g,' ')||name;
    return {aktenzeichen:schadennummer,schadennummer,versicherung,ort:ort.replace(/_/g,' '),bezeichnung,schadensart:schadensart||''};
  };
  const scanActive=async()=>{
    await ensureBase(); const out=[];
    const reserved=new Set(['000_Tagesbesichtigung','00_Besichtigt','00_abgelegt','000_AppSystem']);
    const rootData=await graph(`/me/drive/root:/${encPath(cloudRoot())}:/children?$select=id,name,folder,lastModifiedDateTime&$orderby=name`);
    for(const it of (rootData.value||[]).filter(x=>x.folder && !reserved.has(x.name))){
      out.push(Object.assign({cloudItemId:it.id,cloudParentStatus:'offen',status:'offen',geaendert:it.lastModifiedDateTime},parseCloudAktName(it.name)));
    }
    for(const key of ['tagesbesichtigung','besichtigt']){
      const d=await graph(`/me/drive/root:/${encPath(cloudStatusPath(key))}:/children?$select=id,name,folder,lastModifiedDateTime&$orderby=name`);
      for(const it of (d.value||[]).filter(x=>x.folder)){
        out.push(Object.assign({cloudItemId:it.id,cloudParentStatus:key,status:key==='tagesbesichtigung'?'Besichtigung':'Bearbeitung',geaendert:it.lastModifiedDateTime},parseCloudAktName(it.name)));
      }
    }
    return out;
  };
  const createAnalysisJob=async(a)=>{
    await ensureBase();
    const item=await resolveAktItem(a);
    const queuePath=cloudRoot()+'/000_AppSystem/KI_Auftraege';
    const queueId=await ensurePath(queuePath);
    const parentPath=String(item?.parentReference?.path||'');
    const relParent=parentPath.includes(':') ? parentPath.split(':').slice(1).join(':') : '';
    const aktPfad=((relParent||('/'+cloudStatusPath(statusKey(a)))).replace(/\\/g,'/').replace(/\/$/,'')+'/'+item.name).replace(/\/{2,}/g,'/');
    const job={
      action:'analyse_akt',
      schemaVersion:2,
      requestedAt:new Date().toISOString(),
      driveItemId:item.id,
      aktPfad:aktPfad.startsWith('/')?aktPfad:'/'+aktPfad,
      aktOrdnerName:item.name,
      schadennummer:a.schadennummer||a.aktenzeichen||'',
      versicherung:a.versicherung||'',
      ort:a.ort||'',
      name:a.bezeichnung||'',
      schadenart:a.schadensart||'',
      adresse:a.adresse||'',
      plz:a.plz||'',
      besichtigungDatum:a.besichtigungDatum||'',
      outputFolder:'02_Unterlagen SV'
    };
    const stamp=new Date().toISOString().replace(/[:.]/g,'-');
    const fn='KI_Analyse_'+slug(job.schadennummer||'Akt')+'_'+stamp+'.json';
    const blob=new Blob([JSON.stringify(job,null,2)],{type:'application/json'});
    const result=await graph(`/me/drive/items/${queueId}:/${encodeURIComponent(fn)}:/content`,{method:'PUT',headers:{'Content-Type':'application/json'},body:blob});
    return {file:result,job};
  };
  const logoutCloud=()=>{sessionStorage.removeItem(MSTOKEN);setMsToken(null);setMsUser(null);toast('Microsoft abgemeldet');};
  const cloud={connected:!!msToken?.access_token,user:msUser,ensureAkt,list:listCloud,upload:uploadCloud,saveProtocol:saveProtocolCloud,listAktRoot,listChildren,uploadToParent,moveAkt,archiveAkt,archiveCategories,scanActive,resolveAktItem,createAnalysisJob,logout:logoutCloud};


  const akt  = akten.find(a => a.id === view.aktId) || null;
  const prot = akt && view.protId ? akt.protokolle.find(p => p.id === view.protId) : null;

  const setAkt = neu => setAkten(akten.map(a => a.id === neu.id ? Object.assign({}, neu, { geaendert:new Date().toISOString() }) : a));
  const setProt = neu => setAkt(Object.assign({}, akt, { protokolle:akt.protokolle.map(p => p.id === neu.id ? neu : p) }));

  const anlegen = async a => {
    a=Object.assign({},a,{aktenzeichen:a.schadennummer,status:'offen',cloudParentStatus:'offen'});
    setAkten(x=>x.concat(a)); setSheet(false); go({ mode:'akt', aktId:a.id }); toast('Akt angelegt');
    if(cloud.connected){try{const r=await ensureAkt(a); if(r?.cloudItemId)setAkten(x=>x.map(z=>z.id===a.id?Object.assign({},z,r):z));}catch(e){toast('Akt lokal angelegt; OneDrive: '+(e.message||String(e)));}}
  };
  const loeschAkt = id => { setAkten(akten.filter(a => a.id !== id)); go({ mode:'start' }); toast('Akt gelöscht'); };
  const syncCloudAkten=async()=>{
    if(!cloud.connected){toast('OneDrive ist nicht verbunden');return;}
    try{
      const found=await cloud.scanActive();
      setAkten(prev=>{
        const out=prev.slice();
        for(const f of found){
          let i=out.findIndex(a=>a.cloudItemId===f.cloudItemId || (a.aktenzeichen===f.aktenzeichen && statusKey(a)===f.cloudParentStatus));
          if(i>=0){
            const keep=out[i];
            out[i]=Object.assign({},f,keep,{
              cloudItemId:f.cloudItemId,
              cloudParentStatus:f.cloudParentStatus,
              status:f.status,
              geaendert:f.geaendert
            });
          } else out.push(Object.assign(leererAkt(),f,{id:uid(),jahr:String(new Date().getFullYear()),protokolle:[]}));
        }
        return out;
      });
      toast(found.length+' aktive OneDrive-Akten synchronisiert');
    }catch(e){toast(e.message||String(e));}
  };

  useEffect(() => {
    if (view.mode === 'form' && view.protId === 'neu' && akt) {
      const p = leeresProtokoll();
      setAkt(Object.assign({}, akt, { protokolle:akt.protokolle.concat(p) }));
      setView({ mode:'form', aktId:akt.id, protId:p.id });
    }
  }, [view]);

  const sicherung = () => {
    saveBlob(new Blob([JSON.stringify({ akten, pool, ts:new Date().toISOString() }, null, 1)], { type:'application/json' }),
      'Gutachten-Sicherung_' + heute() + '.json');
    toast('Sicherung erstellt');
  };
  const einlesen = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!Array.isArray(d.akten)) throw 0;
        const ids = akten.map(a => a.id);
        setAkten(akten.concat(d.akten.filter(a => ids.indexOf(a.id) < 0)));
        if (Array.isArray(d.pool)) setPool(d.pool);
        toast('Sicherung eingelesen');
      } catch (x) { toast('Datei nicht lesbar'); }
    };
    r.readAsText(f); e.target.value = '';
  };

  const pfad = prot ? aktOrdner(akt) + '/03_Ortsaugenschein/'
    : akt ? aktOrdner(akt) + (view.ordner ? '/' + view.ordner : '') + '/'
    : '/Gutachten_Business/';

  return (
    <div>
      <header className="top">
        <button className="btn sig sm tabsw" onClick={() => setRailAuf(!railAuf)}>Ablage</button>
        <h1>Studio F · Gutachten</h1>
        <span className="path">{pfad}</span>
        <span className="who">{GUTACHTER.split(' ').slice(-1)[0]}</span>
      </header>

      <div className="shell">
        <Rail akten={akten} view={view} go={go} neu={() => setSheet(true)} versteckt={!railAuf} />
        <main className="main">
          {view.mode === 'start' && (
            <div>
              <Start akten={akten} go={go} neu={() => setSheet(true)} cloud={cloud} syncCloud={syncCloudAkten} />
              <Card titel="Datensicherung">
                <p style={{ marginTop:0, fontSize:14, color:'var(--muted)' }}>
                  Aktenstammdaten und Protokollentwürfe werden weiterhin lokal im Browser zwischengespeichert. Die aktiven Aktenordner werden mit der bestehenden OneDrive-Bürostruktur synchronisiert. V0.9 liest die gesamte reale OneDrive-Aktstruktur dynamisch und synchronisiert geänderte Dateien und Ordner während der Nutzung automatisch. Lokale Sicherung trotzdem regelmäßig erstellen.
                </p>
                <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
                  <button className="btn ghost sm" onClick={sicherung}>Sicherung herunterladen</button>
                  <label className="btn ghost sm" style={{ cursor:'pointer' }}>
                    Sicherung einlesen
                    <input type="file" accept="application/json" style={{ display:'none' }} onChange={einlesen} />
                  </label>
                </div>
              </Card>
            </div>
          )}
          {view.mode === 'settings' && <Einstellungen cfg={msCfg} setCfg={setMsCfg} cloud={cloud} go={go} toast={toast} agentCfg={agentCfg} setAgentCfg={setAgentCfg} />}
          {view.mode === 'akt' && akt &&
            <AktView akt={akt} ordner={view.ordner} setAkt={setAkt} go={go} loeschAkt={loeschAkt} toast={toast} cloud={cloud} agent={{cfg:agentCfg}} />}
          {view.mode === 'form' && akt && prot &&
            <Formular key={prot.id} akt={akt} prot={prot} setProt={setProt} go={go} toast={toast} pool={pool} setPool={setPool} cloud={cloud} />}
        </main>
      </div>

      {sheet && <NeuerAkt zu={() => setSheet(false)} anlegen={anlegen} />}
      {msg && <div className="toast" role="status">{msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>

if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
