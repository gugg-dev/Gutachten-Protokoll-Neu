EAAAECQAACBIAABAkAAAgSAAAQJDHgFiFx1IAzosLAAAECQAACBIAABAkAAAgSAAAQJAAAIAgAQAAQQIAAIIEAAAECQAACBIAABAkAAAgSAAAQJAAAIAgAQAAQQIAAIIEAAAECQAACBIAABAkAAAgSAAAQJAAAIAgAQAAQQIAAIIEAAAECQAACFqmB9Cw3e2nJ8BfOx0P0xPgw7kAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCrjc3t6/TI5jz+9fP6QnAoK/f7qYnMMQFAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABC3TA2jY7vbTEy7C6XiYngBcCBcAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQx4BYhUdsAM6LCwAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAEDQ9ebm9nV6BACwLhcAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEF/AAnLM5OlvOlfAAAAAElFTkSuQmCC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12171B;
  --ink-2:#2A343B;
  --muted:#6B7A84;
  --field:#E4E9EB;
  --panel:#FFFFFF;
  --rule:#C3CDD2;
  --signal:#F2B705;
  --pruef:#1F4E5F;
  --alarm:#B03A2E;
  --ok:#2E6B4F;
  --r:2px;
  --pad:clamp(14px,2.2vw,26px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--field);
  color:var(--ink);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;
}
#root{min-height:100%}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-ligatures:none}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}

/* ---------- Kopfleiste ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#EDF1F2;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  display:flex;align-items:center;gap:14px;
  border-bottom:3px solid var(--signal);
}
.top h1{
  font-family:'Barlow Condensed','Arial Narrow',sans-serif;
  font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;
  margin:0;white-space:nowrap;
}
.top .path{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:#8FA0A9;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.top .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8FA0A9;white-space:nowrap}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:0;align-items:start}
.rail{
  background:var(--panel);border-right:1px solid var(--rule);
  min-height:calc(100vh - 60px);padding:18px 0 60px;
}
.main{padding:var(--pad) var(--pad) 96px;max-width:1000px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{min-height:0;border-right:none;border-bottom:1px solid var(--rule);padding-bottom:18px}
  .rail.hide{display:none}
}

/* ---------- Registerbaum ---------- */
.rail-head{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);padding:0 18px 10px;
  display:flex;justify-content:space-between;align-items:center;
}
.tree{list-style:none;margin:0;padding:0}
.node{
  display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit;color:inherit;
  padding:6px 18px 6px 0;position:relative;
}
.node:hover{background:#F4F7F8}
.node .marker{width:6px;flex:0 0 6px;align-self:stretch;background:transparent}
.node.sel .marker{background:var(--signal)}
.node.sel{background:#F4F7F8;font-weight:600}
.node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.lvl-jahr{font-family:'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);padding-left:12px}
.lvl-akt{padding-left:26px;font-size:15px}
.lvl-ord{padding-left:44px;font-size:13.5px}
.lvl-ord .lbl{font-family:'JetBrains Mono',monospace;font-size:12px}

/* ---------- Blöcke ---------- */
.eyebrow{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px;
}
h2.sec{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:clamp(26px,4vw,38px);letter-spacing:.01em;margin:0 0 4px;line-height:1.05;
}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin:14px 0}
.card > .card-h{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2);margin:-2px 0 14px;
  padding-bottom:8px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}

/* ---------- Formular ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:block}
label.f > span{
  display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;
}
input,select,textarea{
  width:100%;font:inherit;color:var(--ink);background:#FBFCFC;
  border:1px solid var(--rule);border-radius:var(--r);padding:9px 10px;
  -webkit-appearance:none;appearance:none;
}
input:focus,select,textarea:focus{outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--pruef);outline-offset:1px;
}
input:focus,textarea:focus,select:focus{border-color:var(--pruef);background:#fff}
textarea{min-height:96px;resize:vertical;line-height:1.5}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
input.num,td input.num{font-family:'JetBrains Mono',monospace;text-align:right}
.check{display:flex;align-items:center;gap:9px;font-size:15px;cursor:pointer;padding:6px 0}
.check input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--pruef)}

/* ---------- Zeilentabellen ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;gap:8px;align-items:end;
  padding:10px;background:#F7F9FA;border:1px solid var(--rule);border-radius:var(--r);
}
.row.person{grid-template-columns:1.3fr 1fr 1.2fr 1fr 34px}
.row.raum{grid-template-columns:1.4fr .7fr .7fr .8fr .8fr 34px}
.row.mess{grid-template-columns:1.2fr 1fr .7fr .9fr 34px}
.row.geraet{grid-template-columns:1.6fr .6fr 34px}
@media (max-width:820px){
  .row.person,.row.raum,.row.mess,.row.geraet{grid-template-columns:1fr 1fr;position:relative;padding-top:10px}
  .row .kill{position:absolute;top:8px;right:8px}
}
.kill{
  height:38px;border:1px solid var(--rule);background:#fff;border-radius:var(--r);
  color:var(--alarm);font-size:18px;line-height:1;cursor:pointer;
}
.kill:hover{background:var(--alarm);color:#fff;border-color:var(--alarm)}
.calc{
  font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--pruef);
  background:#fff;border:1px dashed var(--rule);border-radius:var(--r);
  padding:9px 10px;text-align:right;
}
.sum{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--ink);margin-top:12px;padding-top:8px;
}
.sum .k{font-family:'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.sum .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px}

/* ---------- Buttons ---------- */
button{font:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.12em;text-transform:uppercase;
  padding:11px 18px;border-radius:var(--r);cursor:pointer;border:1px solid var(--ink);
  background:var(--ink);color:#fff;
}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sig{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn.sig:hover{background:#D9A404;border-color:#D9A404}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- Schrittleiste ---------- */
.steps{display:flex;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);overflow:hidden;margin:14px 0}
.step{
  flex:1;background:none;border:0;border-right:1px solid var(--rule);cursor:pointer;
  padding:10px 8px 9px;text-align:left;position:relative;color:var(--muted);min-width:0;
}
.step:last-child{border-right:0}
.step .n{font-family:'JetBrains Mono',monospace;font-size:11px;display:block}
.step .t{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.08em;text-transform:uppercase;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.on{color:var(--ink);background:#fff}
.step.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--signal)}
.step.done{color:var(--ink-2)}
@media (max-width:640px){.step .t{display:none}.step{text-align:center;padding:12px 4px}.step .n{font-size:13px}}

/* ---------- Skizze ---------- */
.pad{border:1px solid var(--rule);background:#fff;border-radius:var(--r);touch-action:none;display:block;width:100%;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--signal)}

/* ---------- Sonstiges ---------- */
.empty{border:1px dashed var(--rule);background:var(--panel);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}
.chip{
  display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r);
  border:1px solid var(--rule);color:var(--muted);background:#fff;
}
.chip.entwurf{border-color:var(--signal);background:#FFF7E0;color:#7A5C00}

const b64url = bytes => {
  let s=''; const a=new Uint8Array(bytes); for (let i=0;i<a.length;i++) s+=String.fromCharCode(a[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
};
const randomUrlSafe = n => { const a=new Uint8Array(n); crypto.getRandomValues(a); return b64url(a); };
const sha256 = async text => crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
const msRedirectUri = () => location.origin + location.pathname.replace(/index\.html$/i,'');

async function microsoftLogin(cfg) {
  if (!cfg.clientId) throw new Error('Client-ID fehlt');
  const verifier=randomUrlSafe(64), challenge=b64url(await sha256(verifier)), state=randomUrlSafe(24);
  sessionStorage.setItem('gp_pkce_verifier',verifier); sessionStorage.setItem('gp_oauth_state',state);
  const q=new URLSearchParams({client_id:cfg.clientId,response_type:'code',redirect_uri:msRedirectUri(),response_mode:'query',scope:GRAPH_SCOPES.join(' '),state,code_challenge:challenge,code_challenge_method:'S256'});

}
async function exchangeMicrosoftCode(cfg, code) {

  const d=await r.json(); if(!r.ok) throw new Error(d.error_description||d.error||'Microsoft-Anmeldung fehlgeschlagen');
  d.expires_at=Date.now()+((d.expires_in||3600)*1000); sessionStorage.setItem(MSTOKEN,JSON.stringify(d)); return d;

async function refreshMicrosoftToken(cfg, token) {
  if(!token?.refresh_token) return null;
  const body=new URLSearchParams({client_id:cfg.clientId,grant_type:'refresh_token',refresh_token:token.refresh_token,scope:GRAPH_SCOPES.join(' ')});
  const r=await fetch(`https://login.microsoftonline.com/${encodeURIComponent(cfg.tenant||'organizations')}/oauth2/v2.0/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});
  const d=await r.json(); if(!r.ok) return null; d.expires_at=Date.now()+((d.expires_in||3600)*1000); if(!d.refresh_token)d.refresh_token=token.refresh_token; sessionStorage.setItem(MSTOKEN,JSON.stringify(d)); return d;
}

const statusOrdner = a => STATUS_ORDNER[statusKey(a)] || '';

const raumWerte = r => {

/* ============================================================

const XE = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/\u0000-\u0008/g,'');

function RUN(text, o = {}) {
  const rpr = '<w:rPr>'
    + (o.b ? '<w:b/>' : '')
    + (o.i ? '<w:i/>' : '')
    + (o.caps ? '<w:caps/><w:spacing w:val="30"/>' : '')
    + `<w:sz w:val="${o.sz || 20}"/><w:szCs w:val="${o.sz || 20}"/>`

function P(text, o = {}) {
  const ppr = '<w:pPr>'

    + '</w:pPr>';
  return `<w:p>${ppr}${RUN(text, o)}</w:p>`;
}

function TBL(rows, widths, o = {}) {
  const borders = '<w:tblBorders>'

    '<w:tr>' + r.map((c, ci) => CELL(
      typeof c === 'object' ? c.t : c,
      widths[ci],
      Object.assign(
        { b:(ri === 0 && o.head) || (typeof c === 'object' && c.b),
          fill:(ri === 0 && o.head) ? 'EDF1F2' : undefined },
        typeof c === 'object' ? { align:c.align, mono:c.mono, sz:c.sz } : {}

    )).join('') + '</w:tr>'
  ).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/>${borders}<w:tblLayout w:type="fixed"/></w:tblPr>${body}</w:tbl>`

    + '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'
    + '<pic:nvPicPr><pic:cNvPr id="9" name="skizze.png"/><pic:cNvPicPr/></pic:nvPicPr>'
    + `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
    + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>`
    + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'
    + '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}

function protokollXML(akt, p, hatBild, bildCx, bildCy) {
  const W = 9070;
  const o = [];
  o.push(P('ORTSAUGENSCHEIN — NIEDERSCHRIFT', { caps:true, sz:18, color:'6B7A84', after:20 }));
  o.push(H1(akt.bezeichnung || 'Ortsaugenschein'));
  o.push(P(aktOrdner(akt), { mono:true, sz:16, color:'6B7A84', after:60 }));
  o.push(P('', { rule:true, after:160 }));

  o.push(H2('1  Rahmendaten'));
  o.push(TBL([
    ['Aktenzeichen',        { t:akt.aktenzeichen || '—', mono:true }],
    ['Versicherung',        akt.versicherung || '—'],
    ['Schadennummer',       { t:akt.schadennummer || '—', mono:true }],
    ['Objektanschrift',     [akt.adresse, [akt.plz, akt.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') || '—'],
    ['Datum / Uhrzeit',     dDE(p.datum) + (p.uhrzeit ? ', ' + p.uhrzeit + ' Uhr' : '')],
    ['Witterung',           [p.witterung, p.temperatur && p.temperatur + ' °C'].filter(Boolean).join(', ') || '—'],
    ['Sachverständiger',    p.gutachter || GUTACHTER],
    ['Koordinaten',         { t:p.gps ? `${p.gps.lat.toFixed(6)}, ${p.gps.lon.toFixed(6)} (±${Math.round(p.gps.acc)} m)` : '—', mono:true }],
  ], [2600, W - 2600]));

  o.push(H2('2  Anwesende Personen'));
  const an = (p.anwesende || []).filter(a => a.name.trim());
  o.push(an.length
    ? TBL([['Name','Funktion','Firma / Vertretung','Kontakt']].concat(
        an.map(a => [a.name, a.funktion || '—', a.firma || '—', a.kontakt || '—'])),
        [2500, 2000, 2570, 2000], { head:true })
    : P('Keine weiteren Personen anwesend.', { i:true }));

  o.push(H2('3  Objekt'));
  o.push(TBL([
    ['Objektart',   p.objektart || '—'],
    ['Baujahr',     { t:p.baujahr || '—', mono:true }],
    ['Nutzung',     p.nutzung || '—'],
    ['Geschoss / Lage', p.geschoss || '—'],
  ], [2600, W - 2600]));

  o.push(H2('4  Befund'));
  o.push(P('4.1  Schadensbild', { b:true, sz:21, after:40 }));
  o.push(P(p.schadensbild || 'Keine Angabe.'));
  o.push(P('4.2  Schadenshergang laut Auskunft vor Ort', { b:true, sz:21, before:120, after:40 }));
  o.push(P(p.hergang || 'Keine Angabe.'));
  if (p.schadenszeitpunkt) o.push(P('Schadenszeitpunkt: ' + p.schadenszeitpunkt));
  if (p.vorschaeden) {
    o.push(P('4.3  Vorschäden / Vorbefassung', { b:true, sz:21, before:120, after:40 }));
    o.push(P(p.vorschaeden));
  }

  const wohnungenWord = (p.wohnungen && p.wohnungen.length) ? p.wohnungen : [{bewohner:'',etage:p.geschoss||'',raeume:p.raeume||[]}];
  const rr = wohnungenWord.flatMap(w => (w.raeume||[]).filter(r=>r.bez&&r.bez.trim()));
  if (rr.length) {
    o.push(H2('5  Betroffene Wohnungen, Räume und Flächen'));
    let gesF=0, gesW=0;
    wohnungenWord.forEach((w,wi)=>{
      const rooms=(w.raeume||[]).filter(r=>r.bez&&r.bez.trim()); if(!rooms.length)return;
      o.push(P(`Wohnung ${wi+1}${w.bewohner?' — Bewohner/Mieter: '+w.bewohner:''}${w.etage?' — Etage: '+w.etage:''}${w.schadenZuordnung?' — '+w.schadenZuordnung:''}`,{b:true,sz:21,before:120,after:50}));
      const rows=[['Raum','Bodenbelag','Boden m²','Wand m²','Decke m²','Sockel lfm']];
      let sF=0,sW=0,sD=0,sS=0;
      rooms.forEach(r=>{ const v=raumWerte(r); const bf=r.betroffen?(n(r.betroffenBoden)>0?n(r.betroffenBoden):v.flaeche):0; const wf=r.betroffen?(n(r.betroffenWand)>0?n(r.betroffenWand):v.wand):0; const df=(r.betroffen&&r.deckeBetroffen)?(n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche):0; const sl=(r.betroffen&&r.sockelBetroffen)?(n(r.sockel)>0?n(r.sockel):v.umfang):0; sF+=bf;sW+=wf;sD+=df;sS+=sl;gesF+=bf;gesW+=wf; rows.push([r.bez,r.belag||'—',{t:de(bf),align:'right',mono:true},{t:de(wf),align:'right',mono:true},{t:de(df),align:'right',mono:true},{t:de(sl),align:'right',mono:true}]); });
      rows.push([{t:'Summe Wohnung',b:true},'',{t:de(sF),align:'right',mono:true,b:true},{t:de(sW),align:'right',mono:true,b:true},{t:de(sD),align:'right',mono:true,b:true},{t:de(sS),align:'right',mono:true,b:true}]);
      o.push(TBL(rows,[1800,1600,1350,1350,1350,1620],{head:true}));
    });
    o.push(P(`Gesamtsumme betroffene Bodenfläche: ${de(gesF)} m² · Gesamtsumme betroffene Wandfläche: ${de(gesW)} m²`,{b:true,before:100}));
  }

  const t = p.trocknung || {};
  o.push(H2('6  Technische Trocknung'));
  if (t.erforderlich) {
    o.push(TBL([
      ['Trocknung erforderlich', 'ja'],
      ['Beginn',                 dDE(t.beginn) || '—'],
      ['Voraussichtliche Dauer', t.dauer || '—'],
      ['Stromzähler / Verrechnung', t.strom || '—'],
    ], [2600, W - 2600]));
    const g = (t.geraete || []).filter(x => x.typ);
    if (g.length) o.push(TBL([['Gerätetyp','Anzahl']].concat(
      g.map(x => [x.typ, { t:String(x.anzahl || ''), align:'right', mono:true }])),
      [6570, 2500], { head:true }));
    const m = (t.messungen || []).filter(x => x.ort);
    if (m.length) {
      o.push(P('Feuchtemessungen', { b:true, sz:21, before:120, after:40 }));
      o.push(TBL([['Messort','Material','Messwert','Datum']].concat(
        m.map(x => [x.ort, x.material || '—', { t:x.wert || '—', align:'right', mono:true }, dDE(x.datum) || '—'])),
        [3000, 2270, 1800, 2000], { head:true }));
    }
  } else {
    o.push(P('Eine technische Trocknung ist nach dem Befund vor Ort nicht erforderlich.'));
  }

  if (hatBild) {
    o.push(H2('7  Skizze'));
    o.push(BILD(bildCx, bildCy, 'rId10'));
    o.push(P(p.skizzeTitel || 'Handskizze, ohne Maßstab, aufgenommen vor Ort.', { i:true, sz:17, color:'6B7A84' }));
  }
  if (p.fotos) {
    o.push(H2((hatBild ? '8' : '7') + '  Fotodokumentation'));
    o.push(P(p.fotos));
  }

  const nr = (hatBild ? 1 : 0) + (p.fotos ? 1 : 0) + 7;
  o.push(H2(nr + '  Zusammenfassung'));
  o.push(P(p.zusammenfassung || 'Keine Angabe.'));
  if (p.ursache)     { o.push(P('Vorläufige Ursachenzuordnung', { b:true, sz:21, before:120, after:40 })); o.push(P(p.ursache)); }
  if (p.empfehlung)  { o.push(P('Empfehlung', { b:true, sz:21, before:120, after:40 })); o.push(P(p.empfehlung)); }
  if (p.naechsterSchritt) { o.push(P('Nächster Schritt', { b:true, sz:21, before:120, after:40 })); o.push(P(p.naechsterSchritt)); }

  o.push(P('', { before:360, after:0 }));
  o.push(P('Innsbruck, am ' + dDE(heute()), { sz:19, after:400 }));
  o.push(P('_______________________________', { after:40 }));
  o.push(P(p.gutachter || GUTACHTER, { b:true, sz:19, after:20 }));
  o.push(P(KANZLEI, { sz:17, color:'6B7A84' }));
  o.push(P('Diese Niederschrift gibt ausschließlich den Befund vor Ort wieder und stellt keine abschließende gutachterliche Beurteilung dar.',
    { i:true, sz:16, color:'6B7A84', before:200 }));

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
    + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
    + ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">'
    + '<w:body>' + o.join('')
    + `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>`
    + '</w:body></w:document>';
}

async function exportDocx(akt, p) {
  const zip = new JSZip();
  let hatBild = false, cx = 0, cy = 0;

  if (p.skizze && p.skizze.indexOf('base64,') > -1) {
    const b64 = p.skizze.split('base64,')[1];
    zip.file('word/media/skizze.png', b64, { base64:true });
    const dim = await new Promise(res => {
      const im = new Image();
      im.onload = () => res({ w:im.width, h:im.height });
      im.onerror = () => res(null);
      im.src = p.skizze;
    });
    if (dim) { cx = 5400000; cy = Math.round(5400000 * dim.h / dim.w); hatBild = true; }
  }

  zip.file('[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Default Extension="png" ContentType="image/png"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '</Types>');

  zip.file('_rels/.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    + '</Relationships>');

  zip.file('word/_rels/document.xml.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + (hatBild ? '<Relationship Id="rId10" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/skizze.png"/>' : '')
    + '</Relationships>');

  zip.file('word/document.xml', protokollXML(akt, p, hatBild, cx, cy));

  const blob = await zip.generateAsync({
    type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  });
  const name = [slug(akt.aktenzeichen) || 'Akt', 'Ortsaugenschein', p.datum].join('_') + '.docx';
  return { blob, name };
}


function gutachtenXML(akt, g) {
  const o=[];

  o.push(P(`${akt.schadennummer||akt.aktenzeichen||''} · ${akt.bezeichnung||''}`, { sz:20, color:'6B7A84' }));
  o.push(P([akt.adresse,[akt.plz,akt.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '), { sz:18, color:'6B7A84' }));
  const kap=[
    ['1  Kurzfassung der Schadenursache',g.kurzfassung],
    ['2  Objektbeschreibung',g.objektbeschreibung],

    ['5  Reparaturbeschreibung',g.reparaturbeschreibung],
  ];
  kap.forEach(([h,t])=>{o.push(H2(h));o.push(P(t||''));});

    + '</w:body></w:document>';
}

const gutachtenLeer=()=>({kurzfassung:'',objektbeschreibung:'',ursacheneruierung:'',schadenbeschreibung:'',reparaturbeschreibung:''});
const textAusBesichtigung=(akt)=>{
  const p=(akt.protokolle||[]).slice().sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''))[0];
  const g=gutachtenLeer();
  if(!p) return g;

  const satz = t => (t||'').trim().replace(/\s+/g,' ');
  const m2 = v => `${de(v)} m²`;
  const lfm = v => `${de(v)} lfm`;

  /* 1 Kurzfassung – ausschließlich aus vorgegebener Ursache */
  const urs=satz(p.ursache);
  if(urs){
    g.kurzfassung = urs.length>420 ? urs.slice(0,417).trim()+'…' : urs;
  }

  /* 2 Objektbeschreibung */
  const obj=[];
  const lage=[akt.strasse||akt.adresse,akt.hausnummer].filter(Boolean).join(' ').trim();
  const ort=[akt.plz,akt.ort].filter(Boolean).join(' ').trim();
  if(p.objektart){
    obj.push(`Bei der gegenständlichen Liegenschaft handelt es sich um ${p.objektart}.`);
  } else {
    obj.push('Gegenstand der Besichtigung war die gegenständliche Liegenschaft.');
  }
  if(lage||ort){
    obj.push(`Die besichtigte Liegenschaft befindet sich${lage?' in '+lage:''}${ort?', '+ort:''}.`);
  }
  if(p.baujahr) obj.push(`Das Baujahr wurde mit ${p.baujahr} angegeben.`);
  if(p.nutzung) obj.push(`Die Nutzung des Objektes erfolgt als ${p.nutzung}.`);
  if(p.geschoss) obj.push(`Der besichtigte Bereich befindet sich im ${p.geschoss}.`);
  if(p.allgemeinzustand) obj.push(`Der allgemeine Erhaltungs- und Instandhaltungszustand ist als ${p.allgemeinzustand} einzustufen.`);
  g.objektbeschreibung=obj.join(' ');

  /* 3 Ursacheneruierung */
  g.ursacheneruierung=urs;

  /* 4 Schadenbeschreibung / 5 Reparaturbeschreibung */
  const sbUrsache=[]; 
  const sbFolge=[];
  const rpUrsache=[];
  const rpFolge=[];

  const wohnungenText=(p.wohnungen&&p.wohnungen.length)
    ? p.wohnungen
    : [{bewohner:'',etage:p.geschoss||'',schadenZuordnung:'Folgeschaden',raeume:p.raeume||[]}];

  wohnungenText.forEach((w,wi)=>{
    const zuordnung=w.schadenZuordnung||'Folgeschaden';
    const bereich = zuordnung==='Ursachenbereich' ? sbUrsache : sbFolge;
    const reparaturBereich = zuordnung==='Ursachenbereich' ? rpUrsache : rpFolge;
    const whTitel=`Wohnung ${wi+1}${w.bewohner?' – Bewohner/Mieter: '+w.bewohner:''}${w.etage?' – '+w.etage:''}`;
    const raumTexte=[];

    (w.raeume||[]).filter(r=>r.bez&&r.betroffen).forEach(r=>{
      const v=raumWerte(r);
      const f=[];

      f.push(`Im ${r.bez} wurde eine Raumgrundfläche von ca. ${m2(v.flaeche)} ermittelt.`);

      if(n(r.betroffenBodenbelag)>0){
        f.push(`Der betroffene Bodenbelag${r.belag?' aus '+r.belag:''} weist eine betroffene Fläche von ca. ${m2(r.betroffenBodenbelag)} auf.`);
      } else if(n(r.betroffenBoden)>0){
        f.push(`Die betroffene Bodenfläche beträgt ca. ${m2(r.betroffenBoden)}.`);
      }

      if(n(r.betroffenWand)>0){
        f.push(`An den Wandflächen${r.wandoberflaeche?' mit '+r.wandoberflaeche:''} sind ca. ${m2(r.betroffenWand)} betroffen.`);
      }

      if(r.deckeBetroffen){
        const df=n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche;
        f.push(`An der Deckenfläche sind ca. ${m2(df)} betroffen.`);
      }

      if(r.sockelBetroffen){
        const sf=n(r.sockel)>0?n(r.sockel):v.umfang;
        f.push(`Weiters sind ca. ${lfm(sf)} Sockelleisten betroffen.`);
      }

      if(r.tuerschaden&&r.tuerschaden!=='Keine sichtbaren Schäden'){
        const ts=r.tuerschaden==='Sonstige sichtbare Schäden'&&r.tuerschadenFreitext
          ? r.tuerschadenFreitext
          : r.tuerschaden;
        f.push(`An der Tür wurden sichtbare Schäden in Form von ${ts} festgestellt.`);
      }

      if(r.individuelleBeschreibungAktiv&&satz(r.individuelleBeschreibung)){
        f.push(satz(r.individuelleBeschreibung));
      }
      if(satz(r.bemerkung)) f.push(satz(r.bemerkung));

      raumTexte.push(`${r.bez}: ${f.join(' ')}`);

      const mass=[];
      if(n(r.betroffenBodenbelag)>0){
        mass.push(`Rückbau und Wiederherstellung von ca. ${m2(r.betroffenBodenbelag)} Bodenbelag${r.belag?' ('+r.belag+')':''}`);
      } else if(n(r.betroffenBoden)>0){
        mass.push(`Wiederherstellung von ca. ${m2(r.betroffenBoden)} Bodenfläche`);
      }
      if(n(r.betroffenWand)>0){
        mass.push(`Wiederherstellung von ca. ${m2(r.betroffenWand)} Wandfläche${r.wandoberflaeche?' ('+r.wandoberflaeche+')':''}`);
      }
      if(r.deckeBetroffen){
        const df=n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche;
        mass.push(`Wiederherstellung von ca. ${m2(df)} Deckenfläche`);
      }
      if(r.sockelBetroffen){
        const sf=n(r.sockel)>0?n(r.sockel):v.umfang;
        mass.push(`Erneuerung von ca. ${lfm(sf)} Sockelleisten`);
      }

      if(r.trockenbauRueckbau&&r.trockenbauRueckbau!=='Nicht erforderlich'){
        mass.push(r.trockenbauRueckbau);
      }

      if(r.verbundabdichtung==='Ja – vorhanden / wiederherzustellen'){
        mass.push('Wiederherstellung der Verbundabdichtung im betroffenen Fliesenbereich');
      } else if(r.verbundabdichtung==='Vorhandensein nicht feststellbar'){
        mass.push('Vor Ausführung der Fliesenarbeiten ist das Vorhandensein einer Verbundabdichtung zu prüfen');
      }

      if(r.tuerschaden&&r.tuerschaden!=='Keine sichtbaren Schäden'){
        mass.push('Die betroffene Tür bzw. deren Bauteile sind hinsichtlich Reparaturfähigkeit zu prüfen und erforderlichenfalls instand zu setzen bzw. zu erneuern');
      }

      if(r.elektropruefung==='Empfohlen'){
        mass.push('Eine Elektroüberprüfung des betroffenen Bereiches wird empfohlen');
      }

      if(r.zusatzmassnahme&&r.zusatzmassnahme!=='Keine') mass.push(r.zusatzmassnahme);
      if(satz(r.massnahmen)) mass.push(satz(r.massnahmen));

      if(mass.length){
        reparaturBereich.push(`${whTitel}, ${r.bez}: ${mass.join('; ')}.`);
      }
    });

    if(raumTexte.length){
      bereich.push(`${whTitel}\n${raumTexte.join('\n\n')}`);
    }
  });

  const sb=[];
  if(sbUrsache.length) sb.push(`Ursachenbereich / Ursachenbehebung\n${sbUrsache.join('\n\n')}`);
  if(sbFolge.length) sb.push(`Folgeschäden\n${sbFolge.join('\n\n')}`);

  if(sb.length){
    g.schadenbeschreibung=sb.join('\n\n');
  } else {
    g.schadenbeschreibung=satz(p.schadensbild);
  }

  const rp=[];
  if(rpUrsache.length) rp.push(`Ursachenbehebung\n${rpUrsache.join('\n\n')}`);
  if(rpFolge.length) rp.push(`Wiederherstellung der Folgeschäden\n${rpFolge.join('\n\n')}`);

  if(p.trocknung?.erforderlich){
    rp.push('Die Durchführung einer technischen Trocknung ist aus technischer Sicht nachvollziehbar und plausibel.');
  }
  if(satz(p.empfehlung)) rp.push(satz(p.empfehlung));

  g.reparaturbeschreibung=rp.join('\n\n');
  return g;
};

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function lookupPlzForOrt(ort){
  const q=String(ort||'').trim(); if(!q) return '';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=at&limit=5&addressdetails=1&q='+encodeURIComponent(q+', Österreich'),{headers:{'Accept':'application/json'}});
    if(!r.ok) return ''; const d=await r.json();
    const hit=(d||[]).find(x=>x.address&&x.address.postcode);
    return hit?.address?.postcode || '';
  }catch(e){return '';}
}

      {statusKey(akt)==='besichtigt' && <Card titel="Akt abschließen"><p style={{marginTop:0}}>Beim Abschluss wird der gesamte Akt unter <span className="mono">00_abgelegt / Schadenkategorie</span> verschoben.</p><div className="grid g2"><Sel l="Ablagekategorie" v={cat} set={setCat} opts={(cats.length?cats:SCHADENARTEN)} /><div style={{display:'flex',alignItems:'end'}}><button className="btn sig" disabled={busyMove||!cloud.connected} onClick={abschliessen}>Akt abschließen & ablegen</button></div></div></Card>}

      <button className="btn ghost sm" style={{borderColor:'var(--alarm)',color:'var(--alarm)'}} onClick={()=>{if(confirm('Lokalen App-Eintrag „'+(akt.bezeichnung||akt.aktenzeichen)+'“ löschen? Der OneDrive-Ordner wird NICHT gelöscht.'))loeschAkt(akt.id)}}>Nur aus App entfernen</button>
    </div>
  );

function GutachtenView({akt,setAkt,go,cloud,toast}){
  const base=Object.assign(gutachtenLeer(),akt.gutachten||{});
  const [g,setG]=useState(base),[busy,setBusy]=useState(false);
  const set=(k,v)=>{const neu=Object.assign({},g,{[k]:v});setG(neu);setAkt(Object.assign({},akt,{gutachten:neu}));};
  const vorbereiten=()=>{
    const auto=textAusBesichtigung(akt);
    const neu={}; Object.keys(auto).forEach(k=>neu[k]=(g[k]||'').trim()?g[k]:auto[k]);
    setG(neu); setAkt(Object.assign({},akt,{gutachten:neu})); toast('Leere Gutachtenfelder aus Besichtigung ergänzt');
  };
  const neuErstellen=()=>{
    if(!confirm('Gutachtenentwurf aus den aktuellen Besichtigungsdaten neu erstellen? Bereits manuell bearbeitete Texte in den fünf Kapiteln werden überschrieben.')) return;
    const neu=textAusBesichtigung(akt);
    setG(neu); setAkt(Object.assign({},akt,{gutachten:neu}));
    toast('Gutachtenentwurf aus aktuellen Besichtigungsdaten neu erstellt');
  };
  const word=async()=>{
    setBusy(true);

function AktExplorer({ akt, go, cloud, toast }) {
  const [stack,setStack]=useState([]);

  const [lastSync,setLastSync]=useState(null);

  const current = stack.length ? stack[stack.length-1] : null;
  const currentId = current?.id || null;
  const title = current?.name || 'Aktstamm';

  const laden=useCallback(async(silent=false)=>{
    if(!cloud.connected){setItems([]);return;}
    if(!silent)setBusy(true);
    setErr('');
    try{
      const data = currentId ? await cloud.listChildren(currentId) : await cloud.listAktRoot(akt);
      setItems(data);
      setLastSync(new Date());
    }catch(e){setErr(e.message||String(e));}
    finally{if(!silent)setBusy(false);}
  },[akt.id,akt.cloudItemId,currentId,cloud.connected]);

    if(!cloud.connected)return;
    const t=setInterval(()=>laden(true),30000);
    return ()=>clearInterval(t);
  },[laden,cloud.connected]);

  const openItem=it=>{
    if(it.folder){setStack(prev=>prev.concat([{id:it.id,name:it.name}]))}

  };

function Skizze({ v, set }) {
  const cvs = useRef(null);
  const strokes = useRef([]);
  const cur = useRef(null);
  const bg = useRef(null);
  const [farbe, setFarbe] = useState('#12171B');
  const [dick, setDick] = useState(3);
  const W = 1400, H = 900;

  const zeichne = useCallback(() => {
    const c = cvs.current; if (!c) return;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#E2E8EA'; x.lineWidth = 1;
    for (let i = 50; i < W; i += 50) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
    for (let i = 50; i < H; i += 50) { x.beginPath(); x.moveTo(0, i); x.lineTo(W, i); x.stroke(); }
    if (bg.current) x.drawImage(bg.current, 0, 0, W, H);
    x.lineCap = 'round'; x.lineJoin = 'round';
    strokes.current.forEach(s => {
      x.strokeStyle = s.f; x.lineWidth = s.d;
      x.beginPath(); s.p.forEach((pt, i) => i ? x.lineTo(pt[0], pt[1]) : x.moveTo(pt[0], pt[1]));
      if (s.p.length === 1) { x.lineTo(s.p[0][0] + .1, s.p[0][1]); }
      x.stroke();
    });
  }, []);

  useEffect(() => {
    if (v) { const im = new Image(); im.onload = () => { bg.current = im; zeichne(); }; im.src = v; }
    else zeichne();
  }, []);

  const pos = e => {
    const r = cvs.current.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  };
  const down = e => { e.preventDefault(); cvs.current.setPointerCapture(e.pointerId); cur.current = { f:farbe, d:dick, p:[pos(e)] }; strokes.current.push(cur.current); zeichne(); };
  const move = e => { if (!cur.current) return; e.preventDefault(); cur.current.p.push(pos(e)); zeichne(); };
  const up   = () => { if (!cur.current) return; cur.current = null; set(cvs.current.toDataURL('image/png')); };

  return (
    <div>
      <div className="tools">
        {['#12171B', '#B03A2E', '#1F4E5F', '#2E6B4F', '#F2B705'].map(f => (
          <button key={f} className={'swatch' + (farbe === f ? ' on' : '')} style={{ background:f }}
            onClick={() => setFarbe(f)} aria-label={'Stiftfarbe ' + f} />
        ))}
        <select style={{ width:'auto' }} value={dick} onChange={e => setDick(+e.target.value)}>
          <option value="2">fein</option><option value="3">mittel</option>
          <option value="6">stark</option><option value="12">Marker</option>
        </select>
        <button className="btn ghost sm" onClick={() => { strokes.current.pop(); zeichne(); set(cvs.current.toDataURL('image/png')); }}>Schritt zurück</button>
        <button className="btn ghost sm" onClick={() => { strokes.current = []; bg.current = null; zeichne(); set(null); }}>Blatt leeren</button>
      </div>
      <canvas ref={cvs} width={W} height={H} className="pad" style={{ aspectRatio:'14 / 9' }}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onPointerLeave={up} />
      <p style={{ fontSize:13, color:'var(--muted)', marginTop:6 }}>
        Mit Apple Pencil, Finger oder Maus zeichnen. Die Skizze wird als Bild in das Worddokument übernommen.
      </p>
    </div>
  );
}
