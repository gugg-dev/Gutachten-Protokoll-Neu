EAAAECQAACBIAABAkAAAgSAAAQJDHgFiFx1IAzosLAAAECQAACBIAABAkAAAgSAAAQJAAAIAgAQAAQQIAAIIEAAAECQAACBIAABAkAAAgSAAAQJAAAIAgAQAAQQIAAIIEAAAECQAACBIAABAkAAAgSAAAQJAAAIAgAQAAQQIAAIIEAAAECQAACFqmB9Cw3e2nJ8BfOx0P0xPgw7kAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCrjc3t6/TI5jz+9fP6QnAoK/f7qYnMMQFAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABC3TA2jY7vbTEy7C6XiYngBcCBcAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQx4BYhUdsAM6LCwAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAEDQ9ebm9nV6BACwLhcAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEECAACCBAAABAkAAAgSAAAQJAAAIEgAAECQAACAIAEAAEF/AAnLM5OlvOlfAAAAAElFTkSuQmCC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12171B;
  --ink-2:#2A343B;
  --muted:#6B7A84;
  --field:#E4E9EB;
  --panel:#FFFFFF;
  --rule:#C3CDD2;
  --signal:#F2B705;
  --pruef:#1F4E5F;
  --alarm:#B03A2E;
  --ok:#2E6B4F;
  --r:2px;
  --pad:clamp(14px,2.2vw,26px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--field);
  color:var(--ink);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;
}
#root{min-height:100%}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-variant-ligatures:none}
.cond{font-family:'Barlow Condensed','Arial Narrow',sans-serif}

/* ---------- Kopfleiste ---------- */
.top{
  position:sticky;top:0;z-index:40;
  background:var(--ink);color:#EDF1F2;
  padding:calc(env(safe-area-inset-top) + 10px) var(--pad) 10px;
  display:flex;align-items:center;gap:14px;
  border-bottom:3px solid var(--signal);
}
.top h1{
  font-family:'Barlow Condensed','Arial Narrow',sans-serif;
  font-weight:700;font-size:20px;letter-spacing:.14em;text-transform:uppercase;
  margin:0;white-space:nowrap;
}
.top .path{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:#8FA0A9;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;
}
.top .who{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8FA0A9;white-space:nowrap}

/* ---------- Layout ---------- */
.shell{display:grid;grid-template-columns:minmax(250px,300px) 1fr;gap:0;align-items:start}
.rail{
  background:var(--panel);border-right:1px solid var(--rule);
  min-height:calc(100vh - 60px);padding:18px 0 60px;
}
.main{padding:var(--pad) var(--pad) 96px;max-width:1000px}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{min-height:0;border-right:none;border-bottom:1px solid var(--rule);padding-bottom:18px}
  .rail.hide{display:none}
}

/* ---------- Registerbaum ---------- */
.rail-head{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);padding:0 18px 10px;
  display:flex;justify-content:space-between;align-items:center;
}
.tree{list-style:none;margin:0;padding:0}
.node{
  display:flex;gap:8px;align-items:baseline;width:100%;text-align:left;
  background:none;border:0;cursor:pointer;font:inherit;color:inherit;
  padding:6px 18px 6px 0;position:relative;
}
.node:hover{background:#F4F7F8}
.node .marker{width:6px;flex:0 0 6px;align-self:stretch;background:transparent}
.node.sel .marker{background:var(--signal)}
.node.sel{background:#F4F7F8;font-weight:600}
.node .lbl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.lvl-jahr{font-family:'Barlow Condensed',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);padding-left:12px}
.lvl-akt{padding-left:26px;font-size:15px}
.lvl-ord{padding-left:44px;font-size:13.5px}
.lvl-ord .lbl{font-family:'JetBrains Mono',monospace;font-size:12px}

/* ---------- Blöcke ---------- */
.eyebrow{
  font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin:0 0 6px;
}
h2.sec{
  font-family:'Barlow Condensed',sans-serif;font-weight:700;
  font-size:clamp(26px,4vw,38px);letter-spacing:.01em;margin:0 0 4px;line-height:1.05;
}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:18px;margin:14px 0}
.card > .card-h{
  font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-2);margin:-2px 0 14px;
  padding-bottom:8px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
}

/* ---------- Formular ---------- */
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:1fr 1fr 1fr}
.g4{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
label.f{display:block}
label.f > span{
  display:block;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:3px;
}
input,select,textarea{
  width:100%;font:inherit;color:var(--ink);background:#FBFCFC;
  border:1px solid var(--rule);border-radius:var(--r);padding:9px 10px;
  -webkit-appearance:none;appearance:none;
}
input:focus,select,textarea:focus{outline:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
  outline:2px solid var(--pruef);outline-offset:1px;
}
input:focus,textarea:focus,select:focus{border-color:var(--pruef);background:#fff}
textarea{min-height:96px;resize:vertical;line-height:1.5}
select{-webkit-appearance:menulist;appearance:auto;background-image:none;padding-right:8px}
input.num,td input.num{font-family:'JetBrains Mono',monospace;text-align:right}
.check{display:flex;align-items:center;gap:9px;font-size:15px;cursor:pointer;padding:6px 0}
.check input{width:20px;height:20px;flex:0 0 20px;accent-color:var(--pruef)}

/* ---------- Zeilentabellen ---------- */
.rows{display:flex;flex-direction:column;gap:8px}
.row{
  display:grid;gap:8px;align-items:end;
  padding:10px;background:#F7F9FA;border:1px solid var(--rule);border-radius:var(--r);
}
.row.person{grid-template-columns:1.3fr 1fr 1.2fr 1fr 34px}
.row.raum{grid-template-columns:1.4fr .7fr .7fr .8fr .8fr 34px}
.row.mess{grid-template-columns:1.2fr 1fr .7fr .9fr 34px}
.row.geraet{grid-template-columns:1.1fr 1.6fr .6fr 34px}
@media (max-width:820px){
  .row.person,.row.raum,.row.mess,.row.geraet{grid-template-columns:1fr 1fr;position:relative;padding-top:10px}
  .row .kill{position:absolute;top:8px;right:8px}
}
.kill{
  height:38px;border:1px solid var(--rule);background:#fff;border-radius:var(--r);
  color:var(--alarm);font-size:18px;line-height:1;cursor:pointer;
}
.kill:hover{background:var(--alarm);color:#fff;border-color:var(--alarm)}
.calc{
  font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--pruef);
  background:#fff;border:1px dashed var(--rule);border-radius:var(--r);
  padding:9px 10px;text-align:right;
}
.sum{
  display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--ink);margin-top:12px;padding-top:8px;
}
.sum .k{font-family:'Barlow Condensed',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:13px}
.sum .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px}

/* ---------- Buttons ---------- */
button{font:inherit}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:15px;
  letter-spacing:.12em;text-transform:uppercase;
  padding:11px 18px;border-radius:var(--r);cursor:pointer;border:1px solid var(--ink);
  background:var(--ink);color:#fff;
}
.btn:hover{background:var(--ink-2)}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sig{background:var(--signal);border-color:var(--signal);color:var(--ink)}
.btn.sig:hover{background:#D9A404;border-color:#D9A404}
.btn.sm{padding:7px 12px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* ---------- Schrittleiste ---------- */
.steps{display:flex;border:1px solid var(--rule);background:var(--panel);border-radius:var(--r);overflow:hidden;margin:14px 0}
.step{
  flex:1;background:none;border:0;border-right:1px solid var(--rule);cursor:pointer;
  padding:10px 8px 9px;text-align:left;position:relative;color:var(--muted);min-width:0;
}
.step:last-child{border-right:0}
.step .n{font-family:'JetBrains Mono',monospace;font-size:11px;display:block}
.step .t{font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.08em;text-transform:uppercase;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step.on{color:var(--ink);background:#fff}
.step.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--signal)}
.step.done{color:var(--ink-2)}
@media (max-width:640px){.step .t{display:none}.step{text-align:center;padding:12px 4px}.step .n{font-size:13px}}

/* ---------- Skizze ---------- */
.pad{border:1px solid var(--rule);background:#fff;border-radius:var(--r);touch-action:none;display:block;width:100%;cursor:crosshair}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid var(--rule);cursor:pointer;padding:0}
.swatch.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--signal)}

/* ---------- Sonstiges ---------- */
.empty{border:1px dashed var(--rule);background:var(--panel);border-radius:var(--r);padding:28px;text-align:center;color:var(--muted)}
.empty p{margin:0 0 14px}
.chip{
  display:inline-block;font-family:'Barlow Condensed',sans-serif;font-size:12px;
  letter-spacing:.14em;text-transform:uppercase;padding:2px 8px;border-radius:var(--r);
  border:1px solid var(--rule);color:var(--muted);background:#fff;
}
.chip.entwurf{border-color:var(--signal);background:#FFF7E0;color:#7A5C00}
.chip.fertig{border-color:var(--ok);background:#EAF3EE;color:var(--ok)}
.readout{
  font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:8px;
}
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--panel);border-top:1px solid var(--rule);
  padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 10px);
  display:flex;gap:10px;justify-content:flex-end;align-items:center;
}
.bar .note{margin-right:auto;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted)}
.sheet{position:fixed;inset:0;background:rgba(18,23,27,.55);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet .box{background:var(--panel);border-radius:var(--r);max-width:520px;width:100%;padding:22px;border-top:4px solid var(--signal);max-height:90vh;overflow:auto}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:70;
  background:var(--ink);color:#fff;padding:10px 18px;border-radius:var(--r);
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em;text-transform:uppercase;font-size:14px;
}
.tabsw{display:none}
@media (max-width:900px){.tabsw{display:inline-flex}}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .18s ease-out}
  @keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
}

/* ---------- App-Dashboard V0.2 ---------- */
.home-hero{background:var(--ink);color:#fff;border-top:4px solid var(--signal);padding:24px;margin-bottom:18px}
.home-hero .eyebrow{color:#9FB0B8}.home-hero h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-size:clamp(34px,6vw,58px);line-height:1}
.home-hero p{max-width:680px;color:#CAD3D7;margin-bottom:0}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.quick{min-height:132px;background:#fff;border:1px solid var(--rule);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}
.quick:hover{border-color:var(--ink);transform:translateY(-1px)}
.quick .ico{font-size:30px}.quick .ttl{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.quick .sub{font-size:13px;color:var(--muted)}
.quick.primary{background:var(--signal);border-color:var(--signal)}.quick.primary .sub{color:#5B4B00}
.case-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
.case-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 18px}
.stat{background:#fff;border:1px solid var(--rule);padding:11px}.stat .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.stat .v{font-family:'JetBrains Mono',monospace;font-size:14px;margin-top:3px;overflow:hidden;text-overflow:ellipsis}
.folder-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.folder-card{background:#fff;border:1px solid var(--rule);padding:14px;text-align:left;cursor:pointer}.folder-card:hover{border-color:var(--ink)}
.folder-card .name{font-family:'JetBrains Mono',monospace;font-size:13px}.folder-card .desc{font-size:12.5px;color:var(--muted);margin-top:5px}
.disabled-panel{border:1px dashed var(--rule);background:#F7F9FA;padding:24px}.disabled-panel strong{font-family:'Barlow Condensed',sans-serif;font-size:20px;letter-spacing:.06em;text-transform:uppercase}
.searchbar{display:flex;gap:8px;margin:14px 0}.searchbar input{font-size:17px;padding:12px 14px}
@media (max-width:700px){.quick-grid,.folder-grid{grid-template-columns:1fr}.statline{grid-template-columns:1fr 1fr}.case-head{display:block}}


/* ---------- OneDrive / Einstellungen ---------- */
.conn{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.dot.ok{background:var(--ok)}
.dot.warn{background:var(--signal)}
.filelist{display:flex;flex-direction:column;border:1px solid var(--rule);background:#fff}
.fileitem{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--rule);text-align:left;background:#fff;color:var(--ink);width:100%}
.fileitem:last-child{border-bottom:0}.fileitem:hover{background:#F4F7F8}.fileitem .fi{font-size:21px}.fileitem .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fileitem .meta{font:11px 'JetBrains Mono',monospace;color:var(--muted);margin-top:2px}.fileitem .sz{font:11px 'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}
.statusbox{border-left:4px solid var(--rule);background:#F7F9FA;padding:12px 14px;margin:12px 0}.statusbox.ok{border-left-color:var(--ok)}.statusbox.warn{border-left-color:var(--signal)}
.codehint{font:12px 'JetBrains Mono',monospace;background:#F4F7F8;border:1px solid var(--rule);padding:10px;overflow:auto}

@media print{.top,.rail,.bar,.steps{display:none}}

const XE = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
  .replace(/"/g,'&quot;').replace(/\u0000-\u0008/g,'');

function RUN(text, o = {}) {
  const rpr = '<w:rPr>'
    + (o.b ? '<w:b/>' : '')
    + (o.i ? '<w:i/>' : '')
    + (o.caps ? '<w:caps/><w:spacing w:val="30"/>' : '')
    + `<w:sz w:val="${o.sz || 20}"/><w:szCs w:val="${o.sz || 20}"/>`
    + (o.color ? `<w:color w:val="${o.color}"/>` : '')
    + (o.mono ? '<w:rFonts w:ascii="Consolas" w:hAnsi="Consolas"/>' : '')
    + '</w:rPr>';
  const parts = String(text == null ? '' : text).split('\n');
  return parts.map((t, i) =>
    `<w:r>${rpr}${i ? '<w:br/>' : ''}<w:t xml:space="preserve">${XE(t)}</w:t></w:r>`
  ).join('');
}

function P(text, o = {}) {
  const ppr = '<w:pPr>'
    + `<w:spacing w:before="${o.before || 0}" w:after="${o.after == null ? 100 : o.after}" w:line="260" w:lineRule="auto"/>`
    + (o.align ? `<w:jc w:val="${o.align}"/>` : '')
    + (o.rule ? '<w:pBdr><w:bottom w:val="single" w:sz="8" w:space="2" w:color="12171B"/></w:pBdr>' : '')
    + (o.ind ? `<w:ind w:left="${o.ind}"/>` : '')
    + '</w:pPr>';
  return `<w:p>${ppr}${RUN(text, o)}</w:p>`;
}

const H1 = t => P(t, { b:true, sz:32, after:80, caps:false });
const H2 = t => P(t, { b:true, sz:24, before:220, after:90, rule:true });

function CELL(v, w, o = {}) {
  return `<w:tc><w:tcPr><w:tcW w:w="${w}" w:type="dxa"/>`
    + (o.fill ? `<w:shd w:val="clear" w:fill="${o.fill}"/>` : '')
    + '<w:tcMar><w:top w:w="60" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:left w:w="80" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tcMar>'
    + '</w:tcPr>'
    + P(v, { sz:o.sz || 19, b:o.b, after:0, align:o.align, mono:o.mono })
    + '</w:tc>';
}

function TBL(rows, widths, o = {}) {
  const borders = '<w:tblBorders>'
    + ['top','left','bottom','right','insideH','insideV']
      .map(s => `<w:${s} w:val="single" w:sz="4" w:space="0" w:color="C3CDD2"/>`).join('')
    + '</w:tblBorders>';
  const body = rows.map((r, ri) =>
    '<w:tr>' + r.map((c, ci) => CELL(
      typeof c === 'object' ? c.t : c,
      widths[ci],
      Object.assign(
        { b:(ri === 0 && o.head) || (typeof c === 'object' && c.b),
          fill:(ri === 0 && o.head) ? 'EDF1F2' : undefined },
        typeof c === 'object' ? { align:c.align, mono:c.mono, sz:c.sz } : {}
      )
    )).join('') + '</w:tr>'
  ).join('');
  return `<w:tbl><w:tblPr><w:tblW w:w="${widths.reduce((a,b)=>a+b,0)}" w:type="dxa"/>${borders}<w:tblLayout w:type="fixed"/></w:tblPr>${body}</w:tbl>`
    + P('', { after:60 });
}

function BILD(cx, cy, rid) {
  return '<w:p><w:pPr><w:spacing w:after="120"/></w:pPr><w:r><w:drawing>'
    + `<wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/>`
    + '<wp:effectExtent l="0" t="0" r="0" b="0"/><wp:docPr id="9" name="Skizze"/>'
    + '<wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr>'
    + '<a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">'
    + '<a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture">'
    + '<pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture">'
    + '<pic:nvPicPr><pic:cNvPr id="9" name="skizze.png"/><pic:cNvPicPr/></pic:nvPicPr>'
    + `<pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill>`
    + `<pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm>`
    + '<a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr>'
    + '</pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>';
}

function protokollXML(akt, p, hatBild, bildCx, bildCy, hatBild2=false, bildCx2=0, bildCy2=0) {
  const W = 9070;
  const o = [];
  o.push(P('ORTSAUGENSCHEIN — NIEDERSCHRIFT', { caps:true, sz:18, color:'6B7A84', after:20 }));
  o.push(H1(akt.bezeichnung || 'Ortsaugenschein'));
  o.push(P(aktOrdner(akt), { mono:true, sz:16, color:'6B7A84', after:60 }));
  o.push(P('', { rule:true, after:160 }));

  o.push(H2('1  Rahmendaten'));
  o.push(TBL([
    ['Aktenzeichen',        { t:akt.aktenzeichen || '—', mono:true }],
    ['Versicherung',        akt.versicherung || '—'],
    ['Schadennummer',       { t:akt.schadennummer || '—', mono:true }],
    ['Objektanschrift',     [akt.adresse, [akt.plz, akt.ort].filter(Boolean).join(' ')].filter(Boolean).join(', ') || '—'],
    ['Datum / Uhrzeit',     dDE(p.datum) + (p.uhrzeit ? ', ' + p.uhrzeit + ' Uhr' : '')],
    ['Witterung',           [p.witterung, p.temperatur && p.temperatur + ' °C'].filter(Boolean).join(', ') || '—'],
    ['Sachverständiger',    p.gutachter || GUTACHTER],
    ['Koordinaten',         { t:p.gps ? `${p.gps.lat.toFixed(6)}, ${p.gps.lon.toFixed(6)} (±${Math.round(p.gps.acc)} m)` : '—', mono:true }],
  ], [2600, W - 2600]));

  o.push(H2('2  Anwesende Personen'));
  const an = (p.anwesende || []).filter(a => a.name.trim());
  o.push(an.length
    ? TBL([['Name','Funktion','Firma / Vertretung','Kontakt']].concat(
        an.map(a => [a.name, a.funktion || '—', a.firma || '—', a.kontakt || '—'])),
        [2500, 2000, 2570, 2000], { head:true })
    : P('Keine weiteren Personen anwesend.', { i:true }));

  o.push(H2('3  Objekt'));
  o.push(TBL([
    ['Objektart',   p.objektart || '—'],
    ['Baujahr',     { t:p.baujahr || '—', mono:true }],
    ['Nutzung',     p.nutzung || '—'],
    ['Geschoss / Lage', p.geschoss || '—'],
    ['Allgemeinzustand', p.allgemeinzustand || '—'],
    ['Sanierung / Bezug', p.objektsanierung || '—'],
    ['Grundsubstanz / ergänzende Objektfeststellung', p.grundsubstanz || 'Keine näheren Angaben.'],
  ], [2600, W - 2600]));

  o.push(H2('4  Befund'));
  o.push(P('4.1  Schadensbild', { b:true, sz:21, after:40 }));
  o.push(P(p.schadensbild || 'Keine Angabe.'));
  o.push(P('4.2  Angaben vor Ort', { b:true, sz:21, before:120, after:40 }));
  const auskuenfteWord = (p.auskuenfte && p.auskuenfte.length)
    ? p.auskuenfte.filter(x => (x.personId || x.personFreitext || x.angabe))
    : ((p.auskunftsperson || p.hergang) ? [{ personId:'', personFreitext:p.auskunftsperson || '', angabe:p.hergang || '' }] : []);
  if (auskuenfteWord.length) {
    auskuenfteWord.forEach((x, xi) => {
      const ap = (p.anwesende || []).find(a => a.id === x.personId);
      const bez = ap
        ? [ap.name, ap.funktion, ap.firma].filter(Boolean).join(' · ')
        : ([x.personFreitext, x.funktion].filter(Boolean).join(' · ') || 'Nicht näher bezeichnet');
      o.push(P('Auskunftsperson: ' + bez, { b:true, before:xi ? 90 : 0, after:30 }));
      o.push(P('Sinngemäße Angabe: ' + (x.angabe || 'Keine Angabe.')));
    });
  } else {
    o.push(P('Keine Angaben vor Ort erfasst.'));
  }
  if (p.schadenszeitpunkt) o.push(P('Schadenszeitpunkt: ' + p.schadenszeitpunkt));
  if (p.vorschaeden) {
    o.push(P('4.3  Vorschäden / Vorbefassung', { b:true, sz:21, before:120, after:40 }));
    o.push(P(p.vorschaeden));
  }

  const wohnungenWord = (p.wohnungen && p.wohnungen.length) ? p.wohnungen : [{top:'',bewohner:'',etage:p.geschoss||'',raeume:p.raeume||[]}];
  const rr = wohnungenWord.flatMap(w => (w.raeume||[]).filter(r=>r.bez&&r.bez.trim()));
  if (rr.length) {
    o.push(H2('5  Betroffene Wohnungen, Räume und Flächen'));
    let gesF=0, gesW=0;
    wohnungenWord.forEach((w,wi)=>{
      const rooms=(w.raeume||[]).filter(r=>r.bez&&r.bez.trim()); if(!rooms.length)return;
      const wp=(w.personen&&w.personen.length)?w.personen:(w.bewohner?[{name:w.bewohner,funktion:w.bewohnerFunktion||''}]:[]);
      o.push(P(`${w.top||('Wohnung '+(wi+1))}${w.etage?' — '+w.etage:''}${w.schadenZuordnung?' — '+w.schadenZuordnung:''}`,{b:true,sz:21,before:120,after:50}));
      if(wp.length) o.push(P('Personen der Einheit: '+wp.filter(x=>x.name).map(x=>x.name+(x.funktion?' ('+x.funktion+')':'')).join('; '),{after:40}));
      if(w.regel72) o.push(P('72-Stunden-Regel: '+w.regel72,{after:40}));
      if(w.angabeSinngemaess) o.push(P('Sinngemäße Angabe' + (w.auskunftPersonFreitext ? ' von '+w.auskunftPersonFreitext+(w.auskunftFunktion?' ('+w.auskunftFunktion+')':'') : '') + ': '+w.angabeSinngemaess,{after:40}));
      if(w.feststellung) o.push(P('Feststellungen des SV: '+w.feststellung,{after:40}));
      if(w.sanierung) o.push(P('Vorgesehene Folgeschadensanierung: '+w.sanierung,{after:40}));
      const rows=[['Raum','Bodenbelag','Boden m²','Wand m²','Decke m²','Sockel lfm']];
      let sF=0,sW=0,sD=0,sS=0;
      rooms.forEach(r=>{ const v=raumWerte(r); const bf=r.betroffen?(n(r.betroffenBoden)>0?n(r.betroffenBoden):v.flaeche):0; const wf=r.betroffen?(n(r.betroffenWand)>0?n(r.betroffenWand):v.wand):0; const df=(r.betroffen&&r.deckeBetroffen)?(n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche):0; const sl=(r.betroffen&&r.sockelBetroffen)?(n(r.sockel)>0?n(r.sockel):v.umfang):0; sF+=bf;sW+=wf;sD+=df;sS+=sl;gesF+=bf;gesW+=wf; rows.push([r.bez,r.belag||'—',{t:de(bf),align:'right',mono:true},{t:de(wf),align:'right',mono:true},{t:de(df),align:'right',mono:true},{t:de(sl),align:'right',mono:true}]); });
      rows.push([{t:'Summe Wohnung',b:true},'',{t:de(sF),align:'right',mono:true,b:true},{t:de(sW),align:'right',mono:true,b:true},{t:de(sD),align:'right',mono:true,b:true},{t:de(sS),align:'right',mono:true,b:true}]);
      o.push(TBL(rows,[1800,1600,1350,1350,1350,1620],{head:true}));
      rooms.forEach(r=>{
        const fest = r.schadenfeststellung || r.bemerkung || '';
        if(fest || r.wiederherstellungFreitext || (r.sanierungspositionen||[]).length){
          o.push(P(r.bez, { b:true, sz:20, before:90, after:25 }));
          if(fest) o.push(P('Feststellung des SV: ' + fest));
          if(r.wiederherstellungFreitext) o.push(P('Erforderliche Wiederherstellung: ' + r.wiederherstellungFreitext));
          if((r.sanierungspositionen||[]).length){
            o.push(P('Wiederherstellungsmaßnahmen: ' + [...new Set(r.sanierungspositionen.map(x=>x.kurz).filter(Boolean))].join('; ')));
          }
        }
      });
    });
    o.push(P(`Gesamtsumme betroffene Bodenfläche: ${de(gesF)} m² · Gesamtsumme betroffene Wandfläche: ${de(gesW)} m²`,{b:true,before:100}));
  }

  const t = p.trocknung || {};
  o.push(H2('6  Technische Trocknung'));
  if (t.erforderlich) {
    o.push(TBL([
      ['Trocknung erforderlich', 'ja'],
      ['Beginn',                 dDE(t.beginn) || '—'],
      ['Aktuelle Trocknungsdauer', t.dauer || '—'],
      ['Stromzähler / Verrechnung', t.strom || '—'],
    ], [2600, W - 2600]));
    const g = (t.geraete || []).filter(x => x.typ);
    if (g.length) o.push(TBL([['Wohnung / Einheit','Leistungsposition Entfeuchtung','Menge / Anzahl']].concat(
      g.map(x => [x.wohnungId || '—', String(x.typ||'').replace(/^\d{2}\s+\d{2}\s+\d{3}\s*·\s*/,''), { t:String(x.anzahl || ''), align:'right', mono:true }])),
      [2400, 4670, 2000], { head:true }));
    const m = (t.messungen || []).filter(x => x.ort);
    if (m.length) {
      o.push(P('Feuchtemessungen', { b:true, sz:21, before:120, after:40 }));
      o.push(TBL([['Messort','Material','Messwert (Digits)','Datum']].concat(
        m.map(x => [x.ort, x.material || '—', { t:x.wert || '—', align:'right', mono:true }, dDE(x.datum) || '—'])),
        [3000, 2270, 1800, 2000], { head:true }));
    }
  } else {
    o.push(P('Eine technische Trocknung ist nach dem Befund vor Ort nicht erforderlich.'));
  }

  if (hatBild || hatBild2) {
    o.push(H2('7  Skizzen'));
    if (hatBild) { o.push(BILD(bildCx, bildCy, 'rId10')); o.push(P(p.skizzeTitel || 'Handskizze 1, ohne Maßstab, aufgenommen vor Ort.', { i:true, sz:17, color:'6B7A84' })); }
    if (hatBild2) { o.push(BILD(bildCx2, bildCy2, 'rId11')); o.push(P(p.skizzeTitel2 || 'Handskizze 2, ohne Maßstab, aufgenommen vor Ort.', { i:true, sz:17, color:'6B7A84' })); }
  }
  if (p.fotos) {
    o.push(H2(((hatBild || hatBild2) ? '8' : '7') + '  Fotodokumentation'));
    o.push(P(p.fotos));
  }

  const nr = ((hatBild || hatBild2) ? 1 : 0) + (p.fotos ? 1 : 0) + 7;
  o.push(H2(nr + '  Zusammenfassung'));
  o.push(P(p.zusammenfassung || 'Keine Angabe.'));
  if (p.ursacheKategorie) o.push(P('Schadenursache · Hauptkategorie: ' + p.ursacheKategorie));
  if (p.ursacheUnterkategorie) o.push(P('Schadenursache · Unterkategorie: ' + p.ursacheUnterkategorie));
  if (p.ursache)     { o.push(P('Schadenursache · Feststellung des SV', { b:true, sz:21, before:120, after:40 })); o.push(P(p.ursache)); }
  if (p.ursachePlausibel) o.push(P('Schadenursache nachvollziehbar und plausibel: ' + p.ursachePlausibel));
  if (p.regress) o.push(P('Regressmöglichkeit: ' + p.regress));
  if (p.ursachenbehebung) { o.push(P('Ursachenbehebung · Feststellungen des SV', { b:true, sz:21, before:120, after:40 })); o.push(P(p.ursachenbehebung)); }
  if (p.empfehlung)  { o.push(P('Empfehlung', { b:true, sz:21, before:120, after:40 })); o.push(P(p.empfehlung)); }
  if (p.naechsterSchritt) { o.push(P('Nächster Schritt', { b:true, sz:21, before:120, after:40 })); o.push(P(p.naechsterSchritt)); }

  o.push(P('', { before:360, after:0 }));
  o.push(P('Innsbruck, am ' + dDE(heute()), { sz:19, after:400 }));
  o.push(P('_______________________________', { after:40 }));
  o.push(P(p.gutachter || GUTACHTER, { b:true, sz:19, after:20 }));
  o.push(P(KANZLEI, { sz:17, color:'6B7A84' }));
  o.push(P('Diese Niederschrift gibt ausschließlich den Befund vor Ort wieder und stellt keine abschließende gutachterliche Beurteilung dar.',
    { i:true, sz:16, color:'6B7A84', before:200 }));

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"'
    + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"'
    + ' xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">'
    + '<w:body>' + o.join('')
    + `<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr>`
    + '</w:body></w:document>';
}

async function exportDocx(akt, p) {
  const zip = new JSZip();
  let hatBild = false, cx = 0, cy = 0, hatBild2 = false, cx2 = 0, cy2 = 0;

  if (p.skizze && p.skizze.indexOf('base64,') > -1) {
    const b64 = p.skizze.split('base64,')[1];
    zip.file('word/media/skizze.png', b64, { base64:true });
    const dim = await new Promise(res => {
      const im = new Image();
      im.onload = () => res({ w:im.width, h:im.height });
      im.onerror = () => res(null);
      im.src = p.skizze;
    });
    if (dim) { cx = 5400000; cy = Math.round(5400000 * dim.h / dim.w); hatBild = true; }
  }

  if (p.skizze2 && p.skizze2.indexOf('base64,') > -1) {
    const b64 = p.skizze2.split('base64,')[1];
    zip.file('word/media/skizze2.png', b64, { base64:true });
    const dim = await new Promise(res => {
      const im = new Image();
      im.onload = () => res({ w:im.width, h:im.height });
      im.onerror = () => res(null);
      im.src = p.skizze2;
    });
    if (dim) { cx2 = 5400000; cy2 = Math.round(5400000 * dim.h / dim.w); hatBild2 = true; }
  }

  zip.file('[Content_Types].xml',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
    + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    + '<Default Extension="xml" ContentType="application/xml"/>'
    + '<Default Extension="png" ContentType="image/png"/>'
    + '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    + '</Types>');

  zip.file('_rels/.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    + '</Relationships>');

  zip.file('word/_rels/document.xml.rels',
    '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    + (hatBild ? '<Relationship Id="rId10" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/skizze.png"/>' : '')
    + (hatBild2 ? '<Relationship Id="rId11" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/skizze2.png"/>' : '')
    + '</Relationships>');

  zip.file('word/document.xml', protokollXML(akt, p, hatBild, cx, cy, hatBild2, cx2, cy2));

  const blob = await zip.generateAsync({
    type:'blob',
    mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',
  });
  const protStamp = (()=>{
    const d=String(p.datum||heute()).replace(/-/g,'');
    const t=String(p.uhrzeit||'').replace(/:/g,'');
    const c=String(p.erstellt||'').replace(/[^0-9]/g,'').slice(0,14);
    return [d,t||c.slice(8,12)||c.slice(8,14)].filter(Boolean).join('_');
  })();
  const name = [slug(akt.aktenzeichen) || 'Akt', 'Ortsaugenschein', protStamp].join('_') + '.docx';
  return { blob, name };
}


function gutachtenXML(akt, g) {
  const o=[];
  o.push(P('GUTACHTENENTWURF', { b:true, sz:34, after:80 }));
  o.push(P(`${akt.schadennummer||akt.aktenzeichen||''} · ${akt.bezeichnung||''}`, { sz:20, color:'6B7A84' }));
  o.push(P([akt.adresse,[akt.plz,akt.ort].filter(Boolean).join(' ')].filter(Boolean).join(', '), { sz:18, color:'6B7A84' }));
  const kap=[
    ['1  Kurzfassung der Schadenursache',g.kurzfassung],
    ['2  Objektbeschreibung',g.objektbeschreibung],
    ['3  Ursacheneruierung',g.ursacheneruierung],
    ['4  Schadenbeschreibung',g.schadenbeschreibung],
    ['5  Reparaturbeschreibung',g.reparaturbeschreibung],
  ];
  kap.forEach(([h,t])=>{o.push(H2(h));o.push(P(t||''));});
  o.push(P('Arbeitsentwurf – zur weiteren sachverständigen Bearbeitung.', { i:true, sz:16, color:'6B7A84', before:260 }));
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>' + o.join('')
    + '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1417" w:right="1417" w:bottom="1417" w:left="1417"/></w:sectPr>'
    + '</w:body></w:document>';
}

async function exportGutachtenDocx(akt,g){
  const zip=new JSZip();
  zip.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  zip.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  zip.file('word/_rels/document.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"></Relationships>');
  zip.file('word/document.xml',gutachtenXML(akt,g));
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  const name=[
    slug(akt.schadennummer||akt.aktenzeichen)||'Akt',
    slug(akt.versicherung||''),
    slug(akt.bezeichnung||''),
    'Gutachtenentwurf',
    (()=>{ const d=new Date(), z=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}`; })()
  ].filter(Boolean).join('_')+'.docx';
  return {blob,name};
}

const gutachtenLeer=()=>({kurzfassung:'',objektbeschreibung:'',ursacheneruierung:'',schadenbeschreibung:'',reparaturbeschreibung:''});
const textAusBesichtigung=(akt)=>{
  const p=(akt.protokolle||[]).slice().sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''))[0];
  const g=gutachtenLeer();
  if(!p) return g;

  const satz = t => (t||'').trim().replace(/\s+/g,' ');
  const m2 = v => `${de(v)} m²`;
  const lfm = v => `${de(v)} lfm`;

  /* 1 Kurzfassung – ausschließlich aus vorgegebener Ursache */
  const urs=satz(p.ursache);
  if(urs){
    g.kurzfassung = urs.length>420 ? urs.slice(0,417).trim()+'…' : urs;
  }

  /* 2 Objektbeschreibung */
  const obj=[];
  const lage=[akt.strasse||akt.adresse,akt.hausnummer].filter(Boolean).join(' ').trim();
  const ort=[akt.plz,akt.ort].filter(Boolean).join(' ').trim();
  if(p.objektart){
    obj.push(`Bei der gegenständlichen Liegenschaft handelt es sich um ${p.objektart}.`);
  } else {
    obj.push('Gegenstand der Besichtigung war die gegenständliche Liegenschaft.');
  }
  if(lage||ort){
    obj.push(`Die besichtigte Liegenschaft befindet sich${lage?' in '+lage:''}${ort?', '+ort:''}.`);
  }
  if(p.baujahr) obj.push(`Das Baujahr wurde mit ${p.baujahr} angegeben.`);
  if(p.nutzung) obj.push(`Die Nutzung des Objektes erfolgt als ${p.nutzung}.`);
  if(p.geschoss) obj.push(`Der besichtigte Bereich befindet sich im ${p.geschoss}.`);
  if(p.allgemeinzustand) obj.push(`Der allgemeine Erhaltungs- und Instandhaltungszustand ist als ${p.allgemeinzustand} einzustufen.`);
  g.objektbeschreibung=obj.join(' ');

  /* 3 Ursacheneruierung */
  g.ursacheneruierung=urs;

  /* 4 Schadenbeschreibung / 5 Reparaturbeschreibung */
  const sbUrsache=[]; 
  const sbFolge=[];
  const rpUrsache=[];
  const rpFolge=[];

  const wohnungenText=(p.wohnungen&&p.wohnungen.length)
    ? p.wohnungen
    : [{bewohner:'',etage:p.geschoss||'',schadenZuordnung:'Folgeschaden',raeume:p.raeume||[]}];

  wohnungenText.forEach((w,wi)=>{
    const zuordnung=w.schadenZuordnung||'Folgeschaden';
    const bereich = zuordnung==='Ursachenbereich' ? sbUrsache : sbFolge;
    const reparaturBereich = zuordnung==='Ursachenbereich' ? rpUrsache : rpFolge;
    const whTitel=[w.top||('Einheit '+(wi+1)), w.bewohner||'', w.etage||''].filter(Boolean).join(' – ');
    const raumTexte=[];

    (w.raeume||[]).filter(r=>r.bez&&r.betroffen).forEach(r=>{
      const v=raumWerte(r);
      const f=[];

      if(satz(r.schadenfeststellung)) f.push(satz(r.schadenfeststellung));

      if(!satz(r.schadenfeststellung) && n(r.betroffenBodenbelag)>0){
        f.push(`Der betroffene Bodenbelag${r.belag?' aus '+r.belag:''} weist eine betroffene Fläche von ca. ${m2(r.betroffenBodenbelag)} auf.`);
      } else if(!satz(r.schadenfeststellung) && n(r.betroffenBoden)>0){
        f.push(`Die betroffene Bodenfläche beträgt ca. ${m2(r.betroffenBoden)}.`);
      }

      if(!satz(r.schadenfeststellung) && n(r.betroffenWand)>0){
        f.push(`An den Wandflächen${r.wandoberflaeche?' mit '+r.wandoberflaeche:''} sind ca. ${m2(r.betroffenWand)} betroffen.`);
      }

      if(!satz(r.schadenfeststellung) && r.deckeBetroffen){
        const df=n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche;
        f.push(`An der Deckenfläche sind ca. ${m2(df)} betroffen.`);
      }

      if(!satz(r.schadenfeststellung) && r.sockelBetroffen){
        const sf=n(r.sockel)>0?n(r.sockel):v.umfang;
        f.push(`Weiters sind ca. ${lfm(sf)} Sockelleisten betroffen.`);
      }

      if(r.tuerschaden&&r.tuerschaden!=='Keine sichtbaren Schäden'){
        const ts=r.tuerschaden==='Sonstige sichtbare Schäden'&&r.tuerschadenFreitext
          ? r.tuerschadenFreitext
          : r.tuerschaden;
        f.push(`An der Tür wurden sichtbare Schäden in Form von ${ts} festgestellt.`);
      }

      if(r.individuelleBeschreibungAktiv&&satz(r.individuelleBeschreibung)){
        f.push(satz(r.individuelleBeschreibung));
      }
      if(satz(r.bemerkung) && satz(r.bemerkung)!==satz(r.schadenfeststellung)) f.push(satz(r.bemerkung));

      raumTexte.push(`${r.bez}: ${f.join(' ')}`);

      const mass=[];
      if(satz(r.wiederherstellungFreitext)) mass.push(satz(r.wiederherstellungFreitext));
      (r.sanierungspositionen||[]).forEach(x=>{if(x&&x.kurz)mass.push(x.kurz);});
      if(!satz(r.wiederherstellungFreitext) && n(r.betroffenBodenbelag)>0){
        mass.push(`Rückbau und Wiederherstellung von ca. ${m2(r.betroffenBodenbelag)} Bodenbelag${r.belag?' ('+r.belag+')':''}`);
      } else if(!satz(r.wiederherstellungFreitext) && n(r.betroffenBoden)>0){
        mass.push(`Wiederherstellung von ca. ${m2(r.betroffenBoden)} Bodenfläche`);
      }
      if(!satz(r.wiederherstellungFreitext) && n(r.betroffenWand)>0){
        mass.push(`Wiederherstellung von ca. ${m2(r.betroffenWand)} Wandfläche${r.wandoberflaeche?' ('+r.wandoberflaeche+')':''}`);
      }
      if(!satz(r.wiederherstellungFreitext) && r.deckeBetroffen){
        const df=n(r.betroffenDecke)>0?n(r.betroffenDecke):v.flaeche;
        mass.push(`Wiederherstellung von ca. ${m2(df)} Deckenfläche`);
      }
      if(!satz(r.wiederherstellungFreitext) && r.sockelBetroffen){
        const sf=n(r.sockel)>0?n(r.sockel):v.umfang;
        mass.push(`Erneuerung von ca. ${lfm(sf)} Sockelleisten`);
      }

      if(r.trockenbauRueckbau&&r.trockenbauRueckbau!=='Nicht erforderlich'){
        mass.push(r.trockenbauRueckbau);
      }

      if(r.verbundabdichtung==='Ja – vorhanden / wiederherzustellen'){
        mass.push('Wiederherstellung der Verbundabdichtung im betroffenen Fliesenbereich');
      } else if(r.verbundabdichtung==='Vorhandensein nicht feststellbar'){
        mass.push('Vor Ausführung der Fliesenarbeiten ist das Vorhandensein einer Verbundabdichtung zu prüfen');
      }

      if(r.tuerschaden&&r.tuerschaden!=='Keine sichtbaren Schäden'){
        mass.push('Die betroffene Tür bzw. deren Bauteile sind hinsichtlich Reparaturfähigkeit zu prüfen und erforderlichenfalls instand zu setzen bzw. zu erneuern');
      }

      if(r.elektropruefung==='Empfohlen'){
        mass.push('Eine Elektroüberprüfung des betroffenen Bereiches wird empfohlen');
      }

      if(r.zusatzmassnahme&&r.zusatzmassnahme!=='Keine') mass.push(r.zusatzmassnahme);
      if(satz(r.massnahmen)) mass.push(satz(r.massnahmen));

      if(mass.length){
        reparaturBereich.push(`${whTitel}, ${r.bez}: ${mass.join('; ')}.`);
      }
    });

    if(raumTexte.length){
      bereich.push(`${whTitel}\n${raumTexte.join('\n\n')}`);
    }
  });

  const sb=[];
  if(sbUrsache.length) sb.push(`Ursachenbereich / Ursachenbehebung\n${sbUrsache.join('\n\n')}`);
  if(sbFolge.length) sb.push(`Folgeschäden\n${sbFolge.join('\n\n')}`);

  if(sb.length){
    g.schadenbeschreibung=sb.join('\n\n');
  } else {
    g.schadenbeschreibung=satz(p.schadensbild);
  }

  const rp=[];
  if(rpUrsache.length) rp.push(`Ursachenbehebung\n${rpUrsache.join('\n\n')}`);
  if(rpFolge.length) rp.push(`Wiederherstellung der Folgeschäden\n${rpFolge.join('\n\n')}`);

  if(p.trocknung?.erforderlich){
    rp.push('Die Durchführung einer technischen Trocknung ist aus technischer Sicht nachvollziehbar und plausibel.');
  }
  if(satz(p.empfehlung)) rp.push(satz(p.empfehlung));

  g.reparaturbeschreibung=rp.join('\n\n');
  return g;
};

function saveBlob(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

const FlaechenSel = ({ l, v, set, max }) => {
  const mx=Math.max(0,n(max));
  const cur=n(v);
  const vals=[];
  if(mx>0){
    for(let x=0.5;x<mx-0.001;x+=0.5) vals.push(Number(x.toFixed(2)));
    vals.push(Number(mx.toFixed(2)));
  }
  if(cur>0 && !vals.some(x=>Math.abs(x-cur)<0.001)) vals.push(Number(cur.toFixed(2)));
  vals.sort((a,b)=>a-b);
  const fmt=x=>Number(x).toFixed(2).replace('.',',');
  const value=cur>0?fmt(cur):'';
  return <Fld l={l}>
    <select value={value} onChange={e=>set(e.target.value)}>
      <option value="">{mx>0?'— Fläche wählen —':'— Raumgröße zuerst erfassen —'}</option>
      {vals.map(x=><option key={fmt(x)} value={fmt(x)}>{de(x)} m²</option>)}
    </select>
  </Fld>;
};

const SelectFree = ({ l, v, set, opts, leer='— bitte wählen —', freiLabel='Andere / freie Eingabe', freiPlaceholder='Freitext eingeben', onFreeCommit, freiFirst=false }) => {
  const known=(opts||[]).includes(v);
  const free=!!v && !known;
  const [frei,setFrei]=React.useState(free);
  React.useEffect(()=>{
    // Ein einmal aktivierter Freitextmodus bleibt während der gesamten Eingabe aktiv.
    // Die neue Person wird erst beim Verlassen des Feldes (oder Enter) übernommen.
    if(v && !(opts||[]).includes(v)) setFrei(true);
  },[v,JSON.stringify(opts||[])]);
  const commit=()=>{ const x=String(v||'').trim(); if(x && onFreeCommit) onFreeCommit(x); };
  return <Fld l={l}>
    <select value={frei?'__frei__':(v||'')} onChange={e=>{ const x=e.target.value; if(x==='__frei__'){setFrei(true); if(known)set('');} else {setFrei(false);set(x);} }}>
      <option value="">{leer}</option>
      {freiFirst && <option value="__frei__">{freiLabel}</option>}
      {(opts||[]).map(o=><option key={o} value={o}>{o}</option>)}

    {frei && <input style={{marginTop:6}} value={v||''} placeholder={freiPlaceholder} onChange={e=>set(e.target.value)} onBlur={commit} onKeyDown={e=>{if(e.key==='Enter'){e.preventDefault();commit();e.currentTarget.blur();}}} />}
  </Fld>;
};

async function lookupPlzForOrt(ort){
  const q=String(ort||'').trim(); if(!q) return '';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&countrycodes=at&limit=5&addressdetails=1&q='+encodeURIComponent(q+', Österreich'),{headers:{'Accept':'application/json'}});
    if(!r.ok) return ''; const d=await r.json();
    const hit=(d||[]).find(x=>x.address&&x.address.postcode);
    return hit?.address?.postcode || '';
  }catch(e){return '';}
}

function AktView({ akt, ordner, setAkt, go, loeschAkt, toast, cloud, agent }) {
  const s = (k,v) => setAkt(Object.assign({},akt,{[k]:v,geaendert:new Date().toISOString()}));
  const prots = akt.protokolle || [];
  const [busyMove,setBusyMove]=useState(false);
  const [cats,setCats]=useState([]);
  const [cat,setCat]=useState(akt.ablageKategorie||akt.schadensart||'');

  useEffect(()=>{ if(cloud.connected) cloud.archiveCategories().then(setCats).catch(()=>setCats([])); },[cloud.connected]);

  const planen=async()=>{
    if(!akt.besichtigungDatum){toast('Bitte zuerst Besichtigungsdatum eintragen');return;}
    setBusyMove(true);
    try{
      const moved=await cloud.moveAkt(akt,'tagesbesichtigung');
      setAkt(Object.assign({},akt,moved,{status:'Besichtigung',cloudParentStatus:'tagesbesichtigung'}));
      toast('Akt nach Tagesbesichtigung verschoben');
    }catch(e){toast(e.message||String(e));}finally{setBusyMove(false);}
  };
  const besichtigungAbschliessen=async()=>{
    if(!confirm('Besichtigung abschließen und Akt nach „Besichtigt“ verschieben?'))return;
    setBusyMove(true);
    try{
      const moved=await cloud.moveAkt(akt,'besichtigt');
      setAkt(Object.assign({},akt,moved,{status:'Bearbeitung',cloudParentStatus:'besichtigt'}));
      toast('Akt nach Besichtigt verschoben');
    }catch(e){toast(e.message||String(e));}finally{setBusyMove(false);}
  };
  const abschliessen=async()=>{
    if(!cat){toast('Bitte Ablagekategorie auswählen');return;}
    if(!confirm('Akt abschließen und unter „Abgelegt / '+cat+'“ verschieben?'))return;
    setBusyMove(true);
    try{
      const moved=await cloud.archiveAkt(akt,cat);
      setAkt(Object.assign({},akt,moved,{status:'abgeschlossen',cloudParentStatus:'abgelegt',ablageKategorie:cat}));
      toast('Akt abgeschlossen und abgelegt');
    }catch(e){toast(e.message||String(e));}finally{setBusyMove(false);}
  };

  if (ordner === '__ki') return <AgentView akt={akt} go={go} cloud={cloud} toast={toast} agent={agent} />;

  if (ordner === '__gutachten') return <GutachtenView akt={akt} setAkt={setAkt} go={go} cloud={cloud} toast={toast} />;

  if (ordner === '__unterlagen') return <AktExplorer akt={akt} go={go} cloud={cloud} toast={toast} />;

  if (ordner && ordner !== '03_Ortsaugenschein') {
    const o = ORDNER.find(x=>x.key===ordner);
    return <CloudFolder akt={akt} ordner={ordner} o={o} go={go} cloud={cloud} toast={toast} />;
  }

      <div className="statline"><div className="stat"><div className="k">Versicherung</div><div className="v">{akt.versicherung || '—'}</div></div><div className="stat"><div className="k">Schadennummer</div><div className="v">{akt.schadennummer || '—'}</div></div><div className="stat"><div className="k">Ort</div><div className="v">{[akt.plz,akt.ort].filter(Boolean).join(' ') || '—'}</div></div><div className="stat"><div className="k">Besichtigung</div><div className="v">{akt.besichtigungDatum ? dDE(akt.besichtigungDatum)+(akt.besichtigungZeit?' · '+akt.besichtigungZeit:'') : '—'}</div></div></div>

      <div className="quick-grid">
        <button className="quick primary" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'03_Ortsaugenschein'})}><span className="ico">📋</span><span><span className="ttl">Ortsaugenschein</span><span className="sub">Erfassungsmodul · {prots.length} Protokoll{prots.length===1?'':'e'}</span></span></button>
        <button className="quick" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'__unterlagen'})}><span className="ico">📁</span><span><span className="ttl">Unterlagen</span><span className="sub">Reale OneDrive-Aktenstruktur</span></span></button>
        <button className="quick" onClick={()=>go({mode:'akt',aktId:akt.id,ordner:'__gutachten'})}><span className="ico">📄</span><span><span className="ttl">Gutachtenentwurf</span><span className="sub">5 Kapitel aus Besichtigung vorbereiten · Word erstellen</span></span></button>
      </div>

      <Card titel="Besichtigungstermin">
        <div className="grid g3"><Txt l="Datum" type="date" v={akt.besichtigungDatum||''} set={v=>s('besichtigungDatum',v)} /><Txt l="Beginn" type="time" v={akt.besichtigungZeit||''} set={v=>s('besichtigungZeit',v)} /><Txt l="Ende (optional)" type="time" v={akt.besichtigungBis||''} set={v=>s('besichtigungBis',v)} /></div>
        <div className="conn" style={{marginTop:12}}>
          {(statusKey(akt)==='offen') && <button className="btn sig" disabled={busyMove||!cloud.connected} onClick={planen}>Termin speichern & nach Tagesbesichtigung</button>}
          {(statusKey(akt)==='tagesbesichtigung') && <button className="btn sig" disabled={busyMove||!cloud.connected} onClick={besichtigungAbschliessen}>Besichtigung abschließen</button>}
          {statusKey(akt)==='besichtigt' && <span className="chip fertig">Besichtigt · Bearbeitung offen</span>}

      {statusKey(akt)==='besichtigt' && <Card titel="Akt abschließen"><p style={{marginTop:0}}>Beim Abschluss wird der gesamte Akt unter <span className="mono">00_abgelegt / Schadenkategorie</span> verschoben.</p><div className="grid g2"><Sel l="Ablagekategorie" v={cat} set={setCat} opts={(cats.length?cats:SCHADENARTEN)} /><div style={{display:'flex',alignItems:'end'}}><button className="btn sig" disabled={busyMove||!cloud.connected} onClick={abschliessen}>Akt abschließen & ablegen</button></div></div></Card>}

      <button className="btn ghost sm" style={{borderColor:'var(--alarm)',color:'var(--alarm)'}} onClick={()=>{if(confirm('Lokalen App-Eintrag „'+(akt.bezeichnung||akt.aktenzeichen)+'“ löschen? Der OneDrive-Ordner wird NICHT gelöscht.'))loeschAkt(akt.id)}}>Nur aus App entfernen</button>
    </div>
  );
}

      {done && <div className="codehint" style={{marginTop:12}}>Analyseauftrag wurde unter Gutachten_Business / 000_AppSystem / KI_Auftraege gespeichert. Sobald der Power-Automate-Flow eingerichtet ist, startet dort automatisch die Verarbeitung.</div>}
      {err && <div className="codehint" style={{marginTop:12,color:'var(--alarm)'}}>{err}</div>}
    </Card>

      <div className="rows">
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">01</div><div>Alle Dateien und Unterordner des Aktes zum Ausführungszeitpunkt erfassen.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">02</div><div>PDF-, Word- und Bildinhalte auslesen; Scans bei Bedarf per OCR verarbeiten.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">03</div><div>Jedes Dokument einzeln zusammenfassen und Quelle sowie Dateiname mitführen.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">04</div><div>Aktenweite Synthese erstellen, Widersprüche und fehlende Angaben kennzeichnen.</div></div>
        <div className="row" style={{gridTemplateColumns:'38px 1fr'}}><div className="mono">05</div><div>Gutachtenentwurf erzeugen und in 02_Unterlagen SV ablegen. Keine automatische Finalisierung.</div></div>
      </div>

  </div>;
}

function GutachtenView({akt,setAkt,go,cloud,toast}){
  const base=Object.assign(gutachtenLeer(),akt.gutachten||{});
  const [g,setG]=useState(base),[busy,setBusy]=useState(false),[kiStatus,setKiStatus]=useState('');
  const set=(k,v)=>{const neu=Object.assign({},g,{[k]:v});setG(neu);setAkt(Object.assign({},akt,{gutachten:neu}));};
  useEffect(()=>{
    let stop=false;
    (async()=>{
      if(!cloud.connected || typeof cloud.readGutachtenDraft!=='function') return;
      try{
        setKiStatus('Gutachtenentwurf.json wird geprüft …');
        const r=await cloud.readGutachtenDraft(akt);
        if(stop) return;
        if(!r){setKiStatus('Noch kein KI-Gutachtenentwurf im Akt vorhanden.');return;}
        const d=r.data||{};
        const neu={
          kurzfassung:String(d.kurzfassung||''),
          objektbeschreibung:String(d.objektbeschreibung||''),
          ursacheneruierung:String(d.ursacheneruierung||''),
          schadenbeschreibung:String(d.schadenbeschreibung||''),
          reparaturbeschreibung:String(d.reparaturbeschreibung||'')
        };
        setG(neu); setAkt(Object.assign({},akt,{gutachten:neu}));
        const key='gutachten_docx_'+(akt.cloudItemId||akt.id||akt.schadennummer||'akt');
        const rev=r.lastModifiedDateTime||r.id||JSON.stringify(d);
        if(localStorage.getItem(key)!==rev){
          setKiStatus('KI-Entwurf geladen · Word wird automatisch erstellt …');
          const {blob,name}=await exportGutachtenDocx(akt,neu);
          await cloud.saveProtocol(akt,blob,name);
          localStorage.setItem(key,rev);
          setKiStatus('KI-Entwurf geladen · neue Word-Version in 02_Unterlagen SV gespeichert.');
          toast('Gutachtenentwurf automatisch als Word gespeichert');
        }else{
          setKiStatus('KI-Entwurf geladen · Word-Version für diesen Entwurf bereits erstellt.');
        }
      }catch(e){ if(!stop)setKiStatus('KI-Entwurf konnte nicht geladen werden: '+(e.message||String(e))); }
    })();
    return ()=>{stop=true;};
  },[akt.id,akt.cloudItemId,cloud.connected]);
  const vorbereiten=()=>{
    const auto=textAusBesichtigung(akt);
    const neu={}; Object.keys(auto).forEach(k=>neu[k]=(g[k]||'').trim()?g[k]:auto[k]);
    setG(neu); setAkt(Object.assign({},akt,{gutachten:neu})); toast('Leere Gutachtenfelder aus Besichtigung ergänzt');
  };
  const neuErstellen=()=>{
    if(!confirm('Gutachtenentwurf aus den aktuellen Besichtigungsdaten neu erstellen? Bereits manuell bearbeitete Texte in den fünf Kapiteln werden überschrieben.')) return;
    const neu=textAusBesichtigung(akt);
    setG(neu); setAkt(Object.assign({},akt,{gutachten:neu}));
    toast('Gutachtenentwurf aus aktuellen Besichtigungsdaten neu erstellt');
  };
  const word=async()=>{
    setBusy(true);
    try{
      const {blob,name}=await exportGutachtenDocx(akt,g);
      if(cloud.connected){await cloud.saveProtocol(akt,blob,name);toast('Gutachtenentwurf in 02_Unterlagen SV gespeichert');}
      else{saveBlob(blob,name);toast('Gutachtenentwurf heruntergeladen');}
    }catch(e){toast('Word-Erstellung fehlgeschlagen: '+(e.message||String(e)));}
    finally{setBusy(false);}
  };
  const latest=(akt.protokolle||[]).slice().sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''))[0];
  return <div>
    <button className="btn ghost sm" onClick={()=>go({mode:'akt',aktId:akt.id})}>← Zum Akt</button>
    <p className="eyebrow" style={{marginTop:18}}>{akt.aktenzeichen} · {akt.bezeichnung}</p>
    <h2 className="sec">Gutachtenentwurf</h2>
    <Card titel="Arbeitsweise">
      <p style={{marginTop:0}}>Aus dem letzten Ortsaugenschein wird ein technischer Arbeitsentwurf erzeugt. Ursachenbereich und Folgeschäden werden getrennt aufgebaut; Flächen, Materialien, Türen, Trockenbau, Verbundabdichtung und empfohlene Elektroüberprüfungen werden übernommen. Alle Kapitel bleiben vollständig editierbar.</p>
      <div className="conn" style={{gap:8,flexWrap:'wrap'}}>
        <button className="btn sig" onClick={vorbereiten} disabled={!latest}>Nur leere Felder ergänzen</button>
        <button className="btn secondary" onClick={neuErstellen} disabled={!latest}>Entwurf neu aus Besichtigung erstellen</button>
        <span className="chip">{latest?'Ortsaugenschein vorhanden':'kein Ortsaugenschein vorhanden'}</span>
      </div>
      <div className="codehint" style={{marginTop:10}}>„Nur leere Felder ergänzen“ schützt bereits bearbeitete Texte. „Entwurf neu erstellen“ überschreibt die fünf Kapitel erst nach Bestätigung.</div>
      {kiStatus && <div className="codehint" style={{marginTop:10}}>{kiStatus}</div>}
    </Card>
    <Card titel="1 · Kurzfassung der Schadenursache"><Area l="Kurzfassung" v={g.kurzfassung} set={v=>set('kurzfassung',v)} hoch ph="Kurze Zusammenfassung der festgestellten Schadenursache." /></Card>
    <Card titel="2 · Objektbeschreibung"><Area l="Objektbeschreibung" v={g.objektbeschreibung} set={v=>set('objektbeschreibung',v)} hoch ph="Liegenschaft, Bauart, Alter/Baujahr, Nutzung und Allgemeinzustand." /></Card>
    <Card titel="3 · Ursacheneruierung"><Area l="Ursacheneruierung" v={g.ursacheneruierung} set={v=>set('ursacheneruierung',v)} hoch ph="Manuell einfügen bzw. fachlich formulieren. Inhalt wird nicht automatisch ergänzt." /></Card>
    <Card titel="4 · Schadenbeschreibung"><Area l="Schadenbeschreibung" v={g.schadenbeschreibung} set={v=>set('schadenbeschreibung',v)} hoch ph="Besichtigungsfeststellungen, Räume, betroffene Flächen und Bauteile." /></Card>
    <Card titel="5 · Reparaturbeschreibung"><Area l="Reparaturbeschreibung" v={g.reparaturbeschreibung} set={v=>set('reparaturbeschreibung',v)} hoch ph="Erforderliche Rückbau-, Trocknungs- und Wiederherstellungsmaßnahmen." /></Card>
    <Card titel="Word-Ausgabe">
      <p style={{marginTop:0,color:'var(--muted)'}}>Der Arbeitsentwurf wird {cloud.connected?'direkt in OneDrive unter 02_Unterlagen SV gespeichert':'lokal als Word-Datei heruntergeladen'}.</p>
      <button className="btn sig" disabled={busy} onClick={word}>{busy?'Word wird erstellt …':'Gutachtenentwurf als Word erstellen'}</button>
    </Card>
  </div>;
}

function AktExplorer({ akt, go, cloud, toast }) {
  const [stack,setStack]=useState([]);
  const [items,setItems]=useState([]);
  const [busy,setBusy]=useState(false);
  const [err,setErr]=useState('');
  const [lastSync,setLastSync]=useState(null);
  const input=useRef(null);

  const current = stack.length ? stack[stack.length-1] : null;
  const currentId = current?.id || null;
  const title = current?.name || 'Aktstamm';

  const laden=useCallback(async(silent=false)=>{
    if(!cloud.connected){setItems([]);return;}
    if(!silent)setBusy(true);
    setErr('');
    try{
      const data = currentId ? await cloud.listChildren(currentId) : await cloud.listAktRoot(akt);
      setItems(data);
      setLastSync(new Date());
    }catch(e){setErr(e.message||String(e));}
    finally{if(!silent)setBusy(false);}
  },[akt.id,akt.cloudItemId,currentId,cloud.connected]);

  useEffect(()=>{laden();},[laden]);
  useEffect(()=>{
    if(!cloud.connected)return;
    const t=setInterval(()=>laden(true),30000);
    return ()=>clearInterval(t);
  },[laden,cloud.connected]);

  const openItem=it=>{
    if(it.folder){setStack(prev=>prev.concat([{id:it.id,name:it.name}]))}
    else if(it.webUrl) window.open(it.webUrl,'_blank');
  };
  const up=()=>setStack(prev=>prev.slice(0,-1));
  const root=()=>setStack([]);
  const upload=async e=>{
    const f=e.target.files?.[0]; if(!f)return;
    setBusy(true); setErr('');
    try{
      const parentId=currentId || (await cloud.resolveAktItem(akt)).id;
      await cloud.uploadToParent(parentId,f);
      toast('Datei in OneDrive gespeichert');
      await laden();
    }catch(x){setErr(x.message||String(x));}
    finally{setBusy(false);e.target.value='';}
  };
  const icon=it=>it.folder?'📁':(it.name?.toLowerCase().endsWith('.pdf')?'📕':it.name?.match(/\.(jpg|jpeg|png|heic)$/i)?'🖼':'📄');

  return <div>
    <button className="btn ghost sm" onClick={()=>go({mode:'akt',aktId:akt.id})}>← Zum Akt</button>
    <p className="eyebrow" style={{marginTop:18}}>{akt.aktenzeichen} · {akt.bezeichnung}</p>
    <h2 className="sec">Unterlagen</h2>
    <div className="codehint" style={{marginTop:10}}>OneDrive-Aktstruktur wird dynamisch gelesen. Dateien dürfen direkt im Aktstamm liegen; vorhandene und später neu angelegte Unterordner werden automatisch erkannt.</div>

    <div className="conn" style={{margin:'14px 0',flexWrap:'wrap'}}>
      <span className={'dot '+(cloud.connected?'ok':'warn')}></span>
      <span>{cloud.connected?'OneDrive verbunden':'OneDrive nicht verbunden'}</span>
      {stack.length>0&&<button className="btn ghost sm" onClick={up}>← Eine Ebene höher</button>}
      {stack.length>0&&<button className="btn ghost sm" onClick={root}>⌂ Aktstamm</button>}
      <button className="btn ghost sm" onClick={()=>laden()} disabled={busy}>↻ Synchronisieren</button>
      <button className="btn sig sm" onClick={()=>input.current?.click()} disabled={busy||!cloud.connected}>＋ Datei hinzufügen</button>
      <input ref={input} type="file" style={{display:'none'}} onChange={upload}/>
      {lastSync&&<span style={{fontSize:12,color:'var(--muted)'}}>Stand {lastSync.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'})} · automatische Aktualisierung alle 30 s</span>}
    </div>

    <div className="readout"><span>Aktstamm</span>{stack.map((x,i)=><span key={x.id}>/ {x.name}</span>)}</div>
    <Card titel={title}>
      {err&&<div className="statusbox warn"><strong>OneDrive-Fehler</strong><div>{err}</div></div>}
      {busy&&<div className="empty"><p>OneDrive wird synchronisiert …</p></div>}
      {!busy&&!err&&!items.length&&<div className="empty"><p>In dieser Ebene befinden sich derzeit keine Dateien oder Ordner.</p></div>}
      {!busy&&items.length>0&&<div className="filelist">{items.map(it=><button key={it.id} className="fileitem" onClick={()=>openItem(it)}><span className="fi">{icon(it)}</span><span><div className="nm">{it.name}</div><div className="meta">{it.lastModifiedDateTime?new Date(it.lastModifiedDateTime).toLocaleString('de-AT'):''}</div></span><span className="sz">{it.folder?(it.folder.childCount||0)+' Obj.':fmtBytes(it.size)}</span></button>)}</div>}
    </Card>
  </div>;
}

function CloudFolder({ akt, ordner, o, go, cloud, toast }) {
  const [items,setItems]=useState([]), [busy,setBusy]=useState(false), [err,setErr]=useState('');
  const input=useRef(null);
  const laden=useCallback(async()=>{
    if(!cloud.connected){setItems([]);return;} setBusy(true);setErr('');
    try{setItems(await cloud.list(akt,ordner));}catch(e){setErr(e.message||String(e));}finally{setBusy(false);}
  },[akt.id,ordner,cloud.connected]);
  useEffect(()=>{laden();},[laden]);
  const upload=async e=>{const f=e.target.files?.[0]; if(!f)return; setBusy(true); try{await cloud.upload(akt,ordner,f);toast('Datei in OneDrive gespeichert');await laden();}catch(x){setErr(x.message||String(x));}finally{setBusy(false);e.target.value='';}};

   ============================================================ */
function Skizze({ v, set }) {
  const cvs = useRef(null);
  const strokes = useRef([]);
  const cur = useRef(null);
  const bg = useRef(null);
  const [farbe, setFarbe] = useState('#12171B');
  const [dick, setDick] = useState(3);
  const W = 1400, H = 900;

  const zeichne = useCallback(() => {
    const c = cvs.current; if (!c) return;
    const x = c.getContext('2d');
    x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
    x.strokeStyle = '#E2E8EA'; x.lineWidth = 1;
    for (let i = 50; i < W; i += 50) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, H); x.stroke(); }
    for (let i = 50; i < H; i += 50) { x.beginPath(); x.moveTo(0, i); x.lineTo(W, i); x.stroke(); }
    if (bg.current) x.drawImage(bg.current, 0, 0, W, H);
    x.lineCap = 'round'; x.lineJoin = 'round';
    strokes.current.forEach(s => {
      x.strokeStyle = s.f; x.lineWidth = s.d;
      x.beginPath(); s.p.forEach((pt, i) => i ? x.lineTo(pt[0], pt[1]) : x.moveTo(pt[0], pt[1]));
      if (s.p.length === 1) { x.lineTo(s.p[0][0] + .1, s.p[0][1]); }
      x.stroke();
    });
  }, []);

  useEffect(() => {
    if (v) { const im = new Image(); im.onload = () => { bg.current = im; zeichne(); }; im.src = v; }
    else zeichne();
  }, []);

  const pos = e => {
    const r = cvs.current.getBoundingClientRect();
    return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
  };
  const down = e => { e.preventDefault(); cvs.current.setPointerCapture(e.pointerId); cur.current = { f:farbe, d:dick, p:[pos(e)] }; strokes.current.push(cur.current); zeichne(); };
  const move = e => { if (!cur.current) return; e.preventDefault(); cur.current.p.push(pos(e)); zeichne(); };
  const up   = () => { if (!cur.current) return; cur.current = null; set(cvs.current.toDataURL('image/png')); };

  return (
    <div>
      <div className="tools">
        {['#12171B', '#B03A2E', '#1F4E5F', '#2E6B4F', '#F2B705'].map(f => (
          <button key={f} className={'swatch' + (farbe === f ? ' on' : '')} style={{ background:f }}
            onClick={() => setFarbe(f)} aria-label={'Stiftfarbe ' + f} />
        ))}
        <select style={{ width:'auto' }} value={dick} onChange={e => setDick(+e.target.value)}>
          <option value="2">fein</option><option value="3">mittel</option>
          <option value="6">stark</option><option value="12">Marker</option>
        </select>
        <button className="btn ghost sm" onClick={() => { strokes.current.pop(); zeichne(); set(cvs.current.toDataURL('image/png')); }}>Schritt zurück</button>
        <button className="btn ghost sm" onClick={() => { strokes.current = []; bg.current = null; zeichne(); set(null); }}>Blatt leeren</button>
      </div>
      <canvas ref={cvs} width={W} height={H} className="pad" style={{ aspectRatio:'14 / 9' }}
        onPointerDown={down} onPointerMove={move} onPointerUp={up} onPointerCancel={up} onPointerLeave={up} />
      <p style={{ fontSize:13, color:'var(--muted)', marginTop:6 }}>
        Mit Apple Pencil, Finger oder Maus zeichnen. Die Skizze wird als Bild in das Worddokument übernommen.
      </p>
    </div>
  );
}

function Formular({ akt, prot, setProt, go, toast, pool, setPool, cloud }) {
  const [schritt, setSchritt] = useState(0);

  const liste = (k, i, feld, wert) => {
    const arr = prot[k].slice(); arr[i] = Object.assign({}, arr[i], { [feld]:wert }); s(k, arr);
  };
  const wohnungen = (prot.wohnungen && prot.wohnungen.length) ? prot.wohnungen : [{ id:'legacy-'+prot.id, bewohner:'', etage:prot.geschoss||'EG', raeume:(prot.raeume||[]).length ? prot.raeume : [leererRaum()] }];
  const messortOptionen = [...new Set(wohnungen.flatMap((w,wi)=>(w.raeume||[]).filter(r=>r.bez&&r.bez.trim()).map(r=>`${w.top||('Wohnung '+(wi+1))} – ${r.bez.trim()}`)))];
  const setWohnungen = ws => setProt(Object.assign({}, prot, { wohnungen:ws, raeume:ws.flatMap(w=>w.raeume||[]) }));
  const setWohnung = (wi, feld, wert) => { const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{[feld]:wert}):w); setWohnungen(ws); };
  const setWohnungsRaum = (wi, ri, feld, wert) => { const ws=wohnungen.map((w,i)=>{ if(i!==wi)return w; const rs=(w.raeume||[]).map((r,j)=>j===ri?Object.assign({},r,{[feld]:wert}):r); return Object.assign({},w,{raeume:rs}); }); setWohnungen(ws); };
  const setWohnungsRaumMass = (wi,ri,feld,wert) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const rs=(w.raeume||[]).map((r,j)=>{
        if(j!==ri)return r;
        const nr=Object.assign({},r,{[feld]:wert});
        const rv=raumWerte(nr);
        if(nr.bodenBetroffen==='Ja') nr.betroffenBodenbelag=rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):'';
        if(nr.wandBetroffen==='Ja') nr.betroffenWand=rv.wand>0?Number(rv.wand).toFixed(2).replace('.',','):'';
        if(nr.deckeBetroffen) nr.betroffenDecke=rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):'';
        if(nr.sockelBetroffen) nr.sockel=rv.umfang>0?Number(rv.umfang).toFixed(2).replace('.',','):'';
        return nr;
      });
      return Object.assign({},w,{raeume:rs});
    });
    setWohnungen(ws);
  };
  const setRaumJaNein = (wi,ri,art,wert) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const rs=(w.raeume||[]).map((r,j)=>{
        if(j!==ri)return r;
        const nr=Object.assign({},r); const rv=raumWerte(nr);
        if(art==='boden'){ nr.bodenBetroffen=wert; nr.betroffenBodenbelag=wert==='Ja'&&rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):''; }
        if(art==='wand'){ nr.wandBetroffen=wert; nr.betroffenWand=wert==='Ja'&&rv.wand>0?Number(rv.wand).toFixed(2).replace('.',','):''; }
        if(art==='decke'){ nr.deckeBetroffen=wert==='Ja'; nr.betroffenDecke=wert==='Ja'&&rv.flaeche>0?Number(rv.flaeche).toFixed(2).replace('.',','):''; }
        if(art==='sockel'){ nr.sockelBetroffen=wert==='Ja'; nr.sockel=wert==='Ja'&&rv.umfang>0?Number(rv.umfang).toFixed(2).replace('.',','):''; }
        return nr;
      });
      return Object.assign({},w,{raeume:rs});
    });
    setWohnungen(ws);
  };
  const setSanierungsGewerk = (wi,ri,gewerk) => { const ws=wohnungen.map((w,i)=>{ if(i!==wi)return w; const rs=(w.raeume||[]).map((r,j)=>j===ri?Object.assign({},r,{sanierungsGewerk:gewerk,sanierungsLeistung:0}):r); return Object.assign({},w,{raeume:rs}); }); setWohnungen(ws); };
  const addSanierungsposition = (wi,ri) => {
    const r=(wohnungen[wi].raeume||[])[ri];
    const gewerk=r.sanierungsGewerk||SANIERUNGS_GEWERKE[0];
    const arr=SANIERUNGS_LV[gewerk]||[]; const pos=arr[Number(r.sanierungsLeistung)||0]; if(!pos)return;
    const neu=(r.sanierungspositionen||[]).concat({id:uid(),gewerk,code:pos.code||'',gruppe:pos.gruppe||'',detail:pos.detail,einheit:pos.einheit||'',preis:pos.preis??null,kurz:pos.kurz});
    setWohnungsRaum(wi,ri,'sanierungspositionen',neu);
  };
  const delSanierungsposition = (wi,ri,pi) => {
    const r=(wohnungen[wi].raeume||[])[ri];
    setWohnungsRaum(wi,ri,'sanierungspositionen',(r.sanierungspositionen||[]).filter((_,i)=>i!==pi));
  };

  const wohnungsPersonen = w => (w.personen && w.personen.length) ? w.personen : (w.bewohner ? [{id:'legacy-'+(w.id||uid()),name:w.bewohner,funktion:w.bewohnerFunktion||''}] : []);
  const personenNamen = [...new Set([
    ...(prot.anwesende||[]).map(a=>a.name),
    ...wohnungen.flatMap(w=>wohnungsPersonen(w).map(x=>x.name)),
    ...(prot.auskuenfte||[]).map(x=>x.personFreitext)
  ].map(x=>String(x||'').trim()).filter(Boolean))];
  const ensureAnwesend = (name, funktion='Bewohner / Nutzer') => {
    const nm=String(name||'').trim(); if(!nm) return prot.anwesende||[];
    if((prot.anwesende||[]).some(a=>String(a.name||'').trim().toLowerCase()===nm.toLowerCase())) return prot.anwesende||[];
    return (prot.anwesende||[]).concat({id:uid(),name:nm,funktion,firma:'',kontakt:''});
  };
  const personFunktion = name => {
    const nm=String(name||'').trim().toLowerCase();
    const hit=(prot.anwesende||[]).find(a=>String(a.name||'').trim().toLowerCase()===nm);
    return hit?.funktion || '';
  };
  const setPersonFunktion = (name, funktion) => {
    const nm=String(name||'').trim(); if(!nm) return prot.anwesende||[];
    let found=false;
    const arr=(prot.anwesende||[]).map(a=>{
      if(String(a.name||'').trim().toLowerCase()===nm.toLowerCase()){ found=true; return Object.assign({},a,{funktion}); }
      return a;
    });
    return found ? arr : arr.concat({id:uid(),name:nm,funktion,firma:'',kontakt:''});
  };
  const setWohnungsPerson = (wi, pi, feld, wert) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).map((x,j)=>j===pi?Object.assign({},x,{[feld]:wert}):x);
      const first=ps[0]||{};
      const aktivePerson=ps[pi]||{};
      const autoAuskunft = {
        auskunftPersonFreitext:aktivePerson.name||'',
        auskunftFunktion:aktivePerson.funktion||personFunktion(aktivePerson.name)||''
      };
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''},autoAuskunft);
    });
    setWohnungen(ws);
  };
  const commitWohnungsPerson = (wi, pi, name) => {
    const nm=String(name||'').trim(); if(!nm)return;
    const current=wohnungsPersonen(wohnungen[wi]);
    const fn=current[pi]?.funktion || personFunktion(nm) || '';
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).map((x,j)=>j===pi?Object.assign({},x,{name:nm,funktion:fn}):x);
      const first=ps[0]||{};
      const aktivePerson=ps[pi]||{};
      const autoAuskunft = {auskunftPersonFreitext:aktivePerson.name||'',auskunftFunktion:aktivePerson.funktion||fn||''};
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''},autoAuskunft);
    });
    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:ensureAnwesend(nm,fn)}));
  };
  const setWohnungsPersonFunktion = (wi, pi, funktion) => {
    const current=wohnungsPersonen(wohnungen[wi]);
    const name=current[pi]?.name||'';
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).map((x,j)=>j===pi?Object.assign({},x,{funktion}):x);
      const first=ps[0]||{};
      const aktivePerson=ps[pi]||{};
      const autoAuskunft = {auskunftPersonFreitext:aktivePerson.name||'',auskunftFunktion:aktivePerson.funktion||funktion||''};
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''},autoAuskunft);

    setProt(Object.assign({},prot,{wohnungen:ws,raeume:ws.flatMap(w=>w.raeume||[]),anwesende:name?setPersonFunktion(name,funktion):(prot.anwesende||[])}));
  };
  const addWohnungsPerson = wi => {
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{personen:wohnungsPersonen(w).concat({id:uid(),name:'',funktion:''})}):w);
    setWohnungen(ws);
  };
  const delWohnungsPerson = (wi,pi) => {
    const ws=wohnungen.map((w,i)=>{
      if(i!==wi)return w;
      const ps=wohnungsPersonen(w).filter((_,j)=>j!==pi);
      const first=ps[0]||{};
      return Object.assign({},w,{personen:ps,bewohner:first.name||'',bewohnerFunktion:first.funktion||''});

    setWohnungen(ws);
  };
  // Während einer Freitexteingabe wird nur das Feld aktualisiert. Erst beim Verlassen
  // des Namensfeldes wird die Person automatisch zu „Anwesende Personen“ übernommen.
  // Dadurch entstehen auf dem iPad keine Teilnamen wie H / Ha / Hau / Haus ... mehr.
  const setBewohner = (wi, name) => {
    const fn=personFunktion(name);
    const ws=wohnungen.map((w,i)=>i===wi?Object.assign({},w,{bewohner:name,bewohnerFunktion:fn||w.bewohnerFunktion||''}):w);
